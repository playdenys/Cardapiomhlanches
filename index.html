<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .modal-slide { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="pb-24">

    <header class="bg-white border-b p-4 sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <div class="flex-1">
                <h1 id="ui-nome" class="font-black text-xl italic uppercase text-slate-800">Carregando...</h1>
                <span class="text-[10px] font-bold text-emerald-500 uppercase tracking-widest">• Loja Aberta</span>
            </div>
        </div>
    </header>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-10 mt-4"></main>

    <div id="bar-carrinho" class="fixed bottom-6 left-0 right-0 z-40 hidden px-4">
        <div onclick="abrirCheckout()" class="max-w-md mx-auto bg-slate-900 rounded-3xl p-4 shadow-2xl flex items-center justify-between text-white cursor-pointer">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-total" class="font-black">R$ 0,00</span>
            </div>
            <span class="text-[10px] font-black uppercase">Finalizar Pedido</span>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-xl rounded-t-[2.5rem] overflow-hidden modal-slide max-h-[90vh] flex flex-col">
            <div class="p-6 overflow-y-auto flex-1">
                <div class="flex justify-between items-start mb-4">
                    <h2 id="m-nome" class="text-2xl font-black text-slate-800"></h2>
                    <button onclick="fecharModal('modal-produto')" class="text-slate-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <p id="m-desc" class="text-slate-500 text-sm mb-6"></p>

                <div id="m-lista-ads" class="space-y-6"></div>

                <div id="m-box-obs" class="mt-6">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Alguma observação?</p>
                    <textarea id="m-obs" class="w-full bg-slate-100 p-4 rounded-2xl h-20 outline-none text-sm font-medium"></textarea>
                </div>
            </div>

            <div class="p-6 border-t bg-white flex items-center gap-4">
                <div class="flex items-center bg-slate-100 rounded-xl">
                    <button onclick="updateQtd(-1)" class="px-4 py-2 font-bold">-</button>
                    <span id="m-qtd" class="font-black w-6 text-center">1</span>
                    <button onclick="updateQtd(1)" class="px-4 py-2 font-bold">+</button>
                </div>
                <button onclick="adicionarAoCarrinho()" id="m-btn-add" class="flex-1 bg-blue-600 text-white h-12 rounded-xl font-black uppercase text-xs">Adicionar</button>
            </div>
        </div>
    </div>

    <div id="modal-checkout" class="fixed inset-0 bg-black/70 z-[110] hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-xl rounded-t-[2.5rem] p-8 modal-slide h-[85vh] overflow-y-auto">
            <h2 class="text-xl font-black mb-6 uppercase italic">Dados do Pedido</h2>
            <div class="space-y-4">
                <input type="text" id="c-nome" placeholder="Seu Nome" class="w-full bg-slate-100 p-4 rounded-xl outline-none font-bold">
                <input type="text" id="c-end" placeholder="Endereço (Rua, Nº, Bairro)" class="w-full bg-slate-100 p-4 rounded-xl outline-none font-bold">
                <select id="c-pagto" class="w-full bg-slate-100 p-4 rounded-xl font-bold">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <button onclick="enviarZap()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase mt-4">Pedir pelo WhatsApp</button>
                <button onclick="fecharModal('modal-checkout')" class="w-full text-slate-400 font-bold text-sm py-2">Voltar ao Cardápio</button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let itemAtual = null; let qtd = 1;

        async function init() {
            try {
                const res = await fetch('produtos.json', { cache: 'no-store' });
                DATA = await res.json();
                document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
                renderMenu();
            } catch(e) { console.error("Erro ao carregar JSON"); }
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            container.innerHTML = DATA.config.categorias.map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat.nome && i.ativo);
                if(!itens.length) return '';
                return `
                    <section>
                        <h2 class="text-xl font-black italic uppercase text-slate-800 mb-4">${cat.nome}</h2>
                        <div class="grid gap-3">
                            ${itens.map(p => `
                                <div onclick="abrirProduto(${p.id})" class="bg-white p-4 rounded-3xl flex items-center border border-slate-100 shadow-sm cursor-pointer active:scale-95 transition-all">
                                    <div class="flex-1">
                                        <h3 class="font-bold text-slate-800 text-sm">${p.nome}</h3>
                                        <p class="text-blue-600 font-black text-xs">R$ ${p.preco.toFixed(2)}</p>
                                    </div>
                                    <img src="${p.imagem}" class="w-16 h-16 object-cover rounded-2xl">
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');
        }

        function abrirProduto(id) {
            itemAtual = JSON.parse(JSON.stringify(DATA.items.find(x => x.id === id)));
            qtd = 1;
            document.getElementById('m-nome').innerText = itemAtual.nome;
            document.getElementById('m-desc').innerText = itemAtual.descricao || '';
            document.getElementById('m-qtd').innerText = qtd;
            document.getElementById('m-obs').value = "";
            
            // Lógica: Mostrar ou Esconder Observação
            document.getElementById('m-box-obs').style.display = (itemAtual.permiteObs === false) ? 'none' : 'block';

            const adsBox = document.getElementById('m-lista-ads');
            adsBox.innerHTML = "";

            // SE TIVER GRUPOS (Pastel de 5 sabores)
            if (itemAtual.gruposAdicionais && itemAtual.gruposAdicionais.length > 0) {
                adsBox.innerHTML = itemAtual.gruposAdicionais.map((grupo, gIdx) => `
                    <div>
                        <p class="text-[10px] font-black uppercase text-blue-600 mb-3">${grupo.nome} (Máx: ${grupo.limite})</p>
                        <div class="space-y-2">
                            ${grupo.itens.map((ad, iIdx) => `
                                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                                    <span class="text-xs font-bold text-slate-600">${ad.nome || ad}</span>
                                    <div class="flex items-center gap-3">
                                        <button onclick="updateAd(${gIdx}, ${iIdx}, -1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-bold">-</button>
                                        <span id="ad-qtd-${gIdx}-${iIdx}" class="text-xs font-black">0</span>
                                        <button onclick="updateAd(${gIdx}, ${iIdx}, 1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-bold">+</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } 
            // SE TIVER ADICIONAIS ANTIGOS (Simples)
            else if (itemAtual.adicionais) {
                adsBox.innerHTML = `<p class="text-[10px] font-black uppercase text-slate-400 mb-3">Adicionais</p>` + 
                itemAtual.adicionais.map((ad, i) => `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl mb-2">
                        <span class="text-xs font-bold">${ad.nome} (+R$ ${ad.preco.toFixed(2)})</span>
                        <div class="flex items-center gap-3">
                            <button onclick="updateAdSimples(${i}, -1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-bold">-</button>
                            <span id="ad-simples-${i}" class="text-xs font-black">0</span>
                            <button onclick="updateAdSimples(${i}, 1)" class="w-8 h-8 bg-white rounded-full shadow-sm font-bold">+</button>
                        </div>
                    </div>
                `).join('');
            }

            updateTotalModal();
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        // Lógica de Trava (O SEGREDO!)
        function updateAd(gIdx, iIdx, delta) {
            const grupo = itemAtual.gruposAdicionais[gIdx];
            const item = grupo.itens[iIdx];
            if (!item.qtd) item.qtd = 0;

            const totalNoGrupo = grupo.itens.reduce((acc, cur) => acc + (cur.qtd || 0), 0);

            if (delta > 0 && totalNoGrupo >= grupo.limite) {
                return alert("Você já atingiu o limite de " + grupo.limite + " opções!");
            }

            if (item.qtd + delta >= 0) {
                item.qtd += delta;
                document.getElementById(`ad-qtd-${gIdx}-${iIdx}`).innerText = item.qtd;
                updateTotalModal();
            }
        }

        function updateAdSimples(idx, delta) {
            const ad = itemAtual.adicionais[idx];
            if (!ad.qtd) ad.qtd = 0;
            if (ad.qtd + delta >= 0) {
                ad.qtd += delta;
                document.getElementById(`ad-simples-${idx}`).innerText = ad.qtd;
                updateTotalModal();
            }
        }

        function updateTotalModal() {
            let totalUnitario = itemAtual.preco;
            if(itemAtual.adicionais) itemAtual.adicionais.forEach(a => totalUnitario += (a.preco * (a.qtd || 0)));
            if(itemAtual.gruposAdicionais) {
                itemAtual.gruposAdicionais.forEach(g => {
                    g.itens.forEach(i => { if(i.qtd) totalUnitario += ((i.preco || 0) * i.qtd); });
                });
            }
            document.getElementById('m-btn-add').innerText = `ADICIONAR R$ ${(totalUnitario * qtd).toFixed(2)}`;
        }

        function updateQtd(d) { qtd = Math.max(1, qtd + d); document.getElementById('m-qtd').innerText = qtd; updateTotalModal(); }

        function adicionarAoCarrinho() {
            let infoAds = "";
            let precoFinal = itemAtual.preco;

            if(itemAtual.adicionais) {
                itemAtual.adicionais.filter(a => a.qtd > 0).forEach(a => {
                    infoAds += `\n- ${a.qtd}x ${a.nome}`;
                    precoFinal += (a.preco * a.qtd);
                });
            }
            if(itemAtual.gruposAdicionais) {
                itemAtual.gruposAdicionais.forEach(g => {
                    g.itens.filter(i => i.qtd > 0).forEach(i => {
                        infoAds += `\n- ${i.qtd}x ${i.nome || i}`;
                        precoFinal += ((i.preco || 0) * i.qtd);
                    });
                });
            }

            carrinho.push({ 
                nome: itemAtual.nome + infoAds, 
                preco: precoFinal * qtd,
                qtd: qtd,
                obs: document.getElementById('m-obs').value 
            });

            fecharModal('modal-produto');
            updateBar();
        }

        function updateBar() {
            const t = carrinho.reduce((a,b) => a + b.preco, 0);
            document.getElementById('cart-total').innerText = "R$ " + t.toFixed(2);
            document.getElementById('bar-carrinho').classList.toggle('hidden', carrinho.length === 0);
        }

        function abrirCheckout() {
            document.getElementById('c-nome').value = localStorage.getItem('c_nome') || '';
            document.getElementById('c-end').value = localStorage.getItem('c_end') || '';
            document.getElementById('modal-checkout').classList.remove('hidden');
        }

        function enviarZap() {
            const nome = document.getElementById('c-nome').value;
            const end = document.getElementById('c-end').value;
            if(!nome || !end) return alert("Preencha nome e endereço!");

            localStorage.setItem('c_nome', nome);
            localStorage.setItem('c_end', end);

            let msg = `*🚀 NOVO PEDIDO*\n*Cliente:* ${nome}\n*Endereço:* ${end}\n\n`;
            carrinho.forEach(i => {
                msg += `✅ *${i.qtd}x ${i.nome}*\n${i.obs ? '_Obs: '+i.obs+'_\n' : ''}\n`;
            });
            const total = carrinho.reduce((a,b) => a + b.preco, 0);
            msg += `*TOTAL: R$ ${total.toFixed(2)}*`;

            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        init();
    </script>
</body>
</html>
