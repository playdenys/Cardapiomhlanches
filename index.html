<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 pb-24 font-sans text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-md mx-auto p-4 flex justify-between items-center">
            <div>
                <h1 id="ui-nome" class="text-xl font-bold text-red-600">Carregando...</h1>
                <div id="status-loja" class="text-xs font-semibold flex items-center gap-1 mt-1">
                    <span class="w-2 h-2 rounded-full bg-gray-300" id="status-cor"></span>
                    <span id="status-texto">Verificando horário...</span>
                </div>
            </div>
        </div>
    </header>

    <main id="menu" class="max-w-md mx-auto p-4 space-y-6 mt-2"></main>

    <div id="bar-carrinho" class="fixed bottom-4 left-0 right-0 z-40 hidden px-4">
        <div onclick="abrirCheckout()" class="max-w-md mx-auto bg-red-600 text-white rounded-lg p-4 shadow-lg flex justify-between items-center cursor-pointer">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-basket-shopping text-xl"></i>
                <div>
                    <p class="text-sm font-medium"><span id="cart-qtd">0</span> itens</p>
                    <p class="text-lg font-bold" id="cart-total">R$ 0,00</p>
                </div>
            </div>
            <span class="font-bold text-sm bg-white/20 px-4 py-2 rounded-md">Ver Sacola</span>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md sm:rounded-lg rounded-t-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <img id="m-img" class="w-full h-48 object-cover bg-gray-200">
            <div class="p-4 overflow-y-auto">
                <h2 id="m-nome" class="text-xl font-bold"></h2>
                <p id="m-desc" class="text-gray-500 text-sm mt-1 mb-4"></p>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Observações</label>
                    <textarea id="m-obs" class="w-full bg-gray-100 rounded-lg p-3 outline-none text-sm" placeholder="Ex: Tirar cebola, maionese à parte..."></textarea>
                </div>
            </div>
            <div class="p-4 border-t flex gap-4 bg-white">
                <div class="flex items-center bg-gray-100 rounded-lg">
                    <button onclick="updateQtd(-1)" class="w-10 h-10 font-bold text-red-600">-</button>
                    <span id="m-qtd" class="w-8 text-center font-bold">1</span>
                    <button onclick="updateQtd(1)" class="w-10 h-10 font-bold text-red-600">+</button>
                </div>
                <button onclick="addCarrinho()" class="flex-1 bg-red-600 text-white font-bold rounded-lg" id="m-btn-add">Adicionar</button>
                <button onclick="fecharModal('modal-produto')" class="w-10 h-10 bg-gray-200 rounded-lg text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <div id="modal-checkout" class="fixed inset-0 bg-black/60 z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md sm:rounded-lg rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Finalizar Pedido</h2>
                <button onclick="fecharModal('modal-checkout')" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="space-y-3">
                <input type="text" id="c-nome" placeholder="Seu Nome Completo" class="w-full bg-gray-100 p-3 rounded-lg outline-none font-medium text-sm">
                <input type="text" id="c-end" placeholder="Endereço completo (Rua, Nº, Bairro)" class="w-full bg-gray-100 p-3 rounded-lg outline-none font-medium text-sm">
                
                <select id="c-pagto" class="w-full bg-gray-100 p-3 rounded-lg outline-none font-medium text-sm">
                    <option value="" disabled selected>Forma de Pagamento</option>
                    <option value="Pix">Pix (Na Entrega)</option>
                    <option value="Cartão">Cartão (Máquininha)</option>
                    <option value="Dinheiro">Dinheiro (Precisa de troco?)</option>
                </select>

                <div id="box-agendamento" class="hidden bg-orange-50 border border-orange-200 p-3 rounded-lg">
                    <p class="text-xs font-bold text-orange-700 mb-1">Loja Fechada! Agende seu pedido:</p>
                    <input type="time" id="c-hora" class="w-full bg-white p-2 rounded border outline-none text-sm">
                </div>

                <div class="border-t pt-3 mt-4">
                    <div class="flex justify-between text-sm text-gray-500 mb-1"><span>Subtotal:</span> <span id="chk-sub">R$ 0,00</span></div>
                    <div class="flex justify-between text-sm text-gray-500 mb-2"><span>Taxa de Entrega:</span> <span id="chk-taxa">R$ 0,00</span></div>
                    <div class="flex justify-between font-bold text-lg"><span>Total:</span> <span id="chk-total">R$ 0,00</span></div>
                </div>

                <button onclick="enviarWhatsApp()" class="w-full bg-green-500 text-white font-bold py-4 rounded-lg mt-2 flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido
                </button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let itemAtual = null; let qtd = 1; let isAberta = false;

        async function init() {
            try {
                const res = await fetch('produtos.json', { cache: 'no-store' });
                DATA = await res.json();
                document.getElementById('ui-nome').innerText = DATA.config?.nomeLoja || "Cardápio";
                verificarHorario();
                renderMenu();
            } catch (e) {
                document.getElementById('menu').innerHTML = "<p class='text-center mt-10 text-red-500'>Erro ao carregar cardápio.</p>";
            }
        }

        function verificarHorario() {
            // Fallback se faltar horário no JSON
            if(!DATA.config?.horarios) { isAberta = true; return; } 

            const agora = new Date();
            const dia = agora.getDay();
            const horaAtual = agora.getHours().toString().padStart(2,'0') + ":" + agora.getMinutes().toString().padStart(2,'0');
            const horarioHoje = DATA.config.horarios[dia];

            isAberta = (horarioHoje && horarioHoje.aberto && horaAtual >= horarioHoje.inicio && horaAtual <= horarioHoje.fim);

            const txt = document.getElementById('status-texto');
            const cor = document.getElementById('status-cor');

            if (isAberta) {
                txt.innerText = "Aberto Agora"; txt.className = "text-green-600"; cor.className = "w-2 h-2 rounded-full bg-green-500";
                document.getElementById('box-agendamento').classList.add('hidden');
            } else {
                txt.innerText = "Fechado (Aceitando Agendamentos)"; txt.className = "text-orange-500"; cor.className = "w-2 h-2 rounded-full bg-orange-500";
                document.getElementById('box-agendamento').classList.remove('hidden');
            }
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            const categorias = DATA.config?.categorias || [];
            const itens = DATA.items || [];

            container.innerHTML = categorias.map(cat => {
                const itensCat = itens.filter(i => i.categoria === cat && i.ativo);
                if (!itensCat.length) return '';
                return `
                <div class="mb-8">
                    <h2 class="text-lg font-bold border-b pb-2 mb-4">${cat}</h2>
                    <div class="space-y-4">
                        ${itensCat.map(p => `
                        <div onclick="abrirProduto(${p.id})" class="flex gap-4 bg-white p-3 rounded-lg shadow-sm border border-gray-100 cursor-pointer">
                            <div class="flex-1">
                                <h3 class="font-bold text-sm">${p.nome}</h3>
                                <p class="text-xs text-gray-500 line-clamp-2 mt-1">${p.descricao || ''}</p>
                                <p class="font-bold text-green-600 text-sm mt-2">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                            ${p.imagem ? `<img src="${p.imagem}" class="w-24 h-24 object-cover rounded-md">` : ''}
                        </div>`).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        function abrirProduto(id) {
            itemAtual = DATA.items.find(x => x.id === id);
            qtd = 1;
            document.getElementById('m-img').src = itemAtual.imagem || 'https://via.placeholder.com/300';
            document.getElementById('m-nome').innerText = itemAtual.nome;
            document.getElementById('m-desc').innerText = itemAtual.descricao || '';
            document.getElementById('m-obs').value = '';
            atualizarModal();
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        function updateQtd(delta) { qtd = Math.max(1, qtd + delta); atualizarModal(); }
        function atualizarModal() {
            document.getElementById('m-qtd').innerText = qtd;
            document.getElementById('m-btn-add').innerText = `Adicionar R$ ${(itemAtual.preco * qtd).toFixed(2)}`;
        }

        function addCarrinho() {
            carrinho.push({
                nome: itemAtual.nome,
                preco: itemAtual.preco,
                qtd: qtd,
                obs: document.getElementById('m-obs').value
            });
            fecharModal('modal-produto');
            atualizarBarra();
        }

        function atualizarBarra() {
            if (carrinho.length === 0) { document.getElementById('bar-carrinho').classList.add('hidden'); return; }
            const total = carrinho.reduce((acc, val) => acc + (val.preco * val.qtd), 0);
            document.getElementById('cart-qtd').innerText = carrinho.length;
            document.getElementById('cart-total').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('bar-carrinho').classList.remove('hidden');
        }

        function abrirCheckout() {
            const sub = carrinho.reduce((acc, val) => acc + (val.preco * val.qtd), 0);
            const taxa = DATA.config?.taxaEntrega || 0;
            document.getElementById('chk-sub').innerText = `R$ ${sub.toFixed(2)}`;
            document.getElementById('chk-taxa').innerText = `R$ ${taxa.toFixed(2)}`;
            document.getElementById('chk-total').innerText = `R$ ${(sub + taxa).toFixed(2)}`;
            
            document.getElementById('c-nome').value = localStorage.getItem('c_nome') || '';
            document.getElementById('c-end').value = localStorage.getItem('c_end') || '';
            
            document.getElementById('modal-checkout').classList.remove('hidden');
        }

        function enviarWhatsApp() {
            const nome = document.getElementById('c-nome').value;
            const end = document.getElementById('c-end').value;
            const pagto = document.getElementById('c-pagto').value;
            const horaAgenda = document.getElementById('c-hora').value;

            if (!nome || !end || !pagto) return alert("Preencha Nome, Endereço e Pagamento!");
            if (!isAberta && !horaAgenda) return alert("A loja está fechada. Por favor, informe a hora do agendamento!");

            localStorage.setItem('c_nome', nome); localStorage.setItem('c_end', end);

            let msg = `*NOVO PEDIDO* 🍔\n\n*Cliente:* ${nome}\n*Endereço:* ${end}\n`;
            if(!isAberta) msg += `⏳ *AGENDADO PARA:* ${horaAgenda}\n`;
            msg += `\n*ITENS:*\n`;
            
            carrinho.forEach(i => { msg += `▪️ ${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2)})\n${i.obs ? '  _Obs: '+i.obs+'_\n' : ''}`; });
            
            const sub = carrinho.reduce((acc, val) => acc + (val.preco * val.qtd), 0);
            const taxa = DATA.config?.taxaEntrega || 0;
            
            msg += `\n*Pagamento:* ${pagto}`;
            msg += `\n*Taxa de Entrega:* R$ ${taxa.toFixed(2)}`;
            msg += `\n*TOTAL: R$ ${(sub + taxa).toFixed(2)}*`;

            const num = DATA.config?.whatsapp || "";
            window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`);
        }

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }
        init();
    </script>
</body>
</html>
