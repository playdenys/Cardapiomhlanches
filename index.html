<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .modal-slide { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .loja-fechada { filter: grayscale(1); pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b p-4">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div id="ui-logo-box" class="hidden"><img id="ui-logo" src="" class="w-12 h-12 rounded-2xl object-cover shadow-sm"></div>
                <div>
                    <h1 id="ui-nome" class="font-black text-xl italic uppercase text-slate-800 tracking-tighter">Carregando...</h1>
                    <div class="flex items-center gap-2">
                        <span id="status-cor" class="w-2 h-2 rounded-full bg-slate-300"></span>
                        <span id="status-txt" class="text-[9px] font-black uppercase tracking-widest text-slate-400 italic">Verificando...</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div id="aviso-fechado" class="hidden max-w-2xl mx-auto m-4 p-4 bg-amber-50 border border-amber-100 rounded-3xl text-center">
        <p class="text-amber-700 font-bold text-xs">No momento estamos fechados. <br> Consulte nossos horários!</p>
    </div>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-10 mt-2"></main>

    <div id="bar-carrinho" class="fixed bottom-6 left-0 right-0 z-40 hidden px-4">
        <div onclick="abrirCheckout()" class="max-w-md mx-auto bg-slate-900 rounded-[2.2rem] p-2 shadow-2xl flex items-center justify-between border border-white/10 cursor-pointer">
            <div class="pl-6 flex items-center gap-4 text-white">
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
                </div>
                <p id="cart-total" class="font-black text-lg">R$ 0,00</p>
            </div>
            <div class="bg-white text-slate-900 h-12 px-8 rounded-[1.8rem] flex items-center font-black uppercase text-[10px]">Finalizar</div>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-end justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] overflow-hidden modal-slide max-h-[92vh] flex flex-col">
            <div class="relative h-48 w-full bg-slate-100">
                <img id="m-img" src="" class="w-full h-full object-cover">
                <button onclick="fecharModal('modal-produto')" class="absolute top-6 right-6 w-10 h-10 bg-white/80 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-8 overflow-y-auto flex-1">
                <h2 id="m-nome" class="text-2xl font-black text-slate-800 tracking-tight"></h2>
                <p id="m-desc" class="text-slate-400 text-sm mt-1 mb-6"></p>

                <div id="m-lista-ads" class="space-y-8"></div>

                <div id="m-box-obs" class="mt-8">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-2">Observações</p>
                    <textarea id="m-obs" placeholder="Alguma preferência?" class="w-full bg-slate-100 p-5 rounded-3xl h-24 outline-none text-sm font-medium focus:ring-2 ring-blue-100 transition-all"></textarea>
                </div>
            </div>

            <div class="p-8 border-t bg-white flex items-center gap-4">
                <div class="flex items-center bg-slate-100 rounded-2xl p-1">
                    <button onclick="updateQtd(-1)" class="w-10 h-10 font-bold text-xl">-</button>
                    <span id="m-qtd" class="w-8 text-center font-black">1</span>
                    <button onclick="updateQtd(1)" class="w-10 h-10 font-bold text-xl">+</button>
                </div>
                <button onclick="adicionarAoCarrinho()" id="m-btn-add" class="flex-1 h-14 rounded-2xl bg-blue-600 text-white font-black uppercase text-[10px] tracking-widest shadow-lg shadow-blue-100">Adicionar</button>
            </div>
        </div>
    </div>

    <div id="modal-checkout" class="fixed inset-0 bg-black/70 z-[120] hidden flex items-end justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] p-8 modal-slide h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-black italic uppercase text-slate-800">Seu Pedido</h2>
                <button onclick="fecharModal('modal-checkout')" class="text-slate-300"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <input type="text" id="c-nome" placeholder="Seu Nome" class="w-full bg-slate-100 p-5 rounded-3xl outline-none font-bold">
                <input type="text" id="c-end" placeholder="Endereço de Entrega" class="w-full bg-slate-100 p-5 rounded-3xl outline-none font-bold">
                <select id="c-pagto" class="w-full bg-slate-100 p-5 rounded-3xl outline-none font-bold appearance-none">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
                <button onclick="finalizarWhatsApp()" class="w-full py-6 rounded-[2.5rem] bg-emerald-600 text-white font-black uppercase text-xs tracking-widest mt-4 shadow-xl">Enviar no WhatsApp <i class="fa-brands fa-whatsapp ml-2 text-lg"></i></button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let itemAtual = null; let qtd = 1;

        async function init() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            
            document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
            if(DATA.config.linkLogo) {
                document.getElementById('ui-logo').src = DATA.config.linkLogo;
                document.getElementById('ui-logo-box').classList.remove('hidden');
            }

            atualizarStatusLoja();
            renderMenu();
        }

        function atualizarStatusLoja() {
            const agora = new Date();
            const dia = agora.getDay();
            const horaH = agora.getHours().toString().padStart(2,'0') + ":" + agora.getMinutes().toString().padStart(2,'0');
            const h = DATA.config.horarios[dia];
            
            let aberta = false;
            if (!DATA.config.fechadoManual && h && h.aberto && horaH >= h.inicio && horaH <= h.fim) {
                aberta = true;
            }

            const txt = document.getElementById('status-txt');
            const cor = document.getElementById('status-cor');
            
            if(aberta) {
                txt.innerText = "Loja Aberta Agora";
                txt.className = "text-[9px] font-black uppercase tracking-widest text-emerald-500 italic";
                cor.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]";
                document.getElementById('menu').classList.remove('loja-fechada');
                document.getElementById('aviso-fechado').classList.add('hidden');
            } else {
                txt.innerText = "Loja Fechada no Momento";
                txt.className = "text-[9px] font-black uppercase tracking-widest text-red-400 italic";
                cor.className = "w-2 h-2 rounded-full bg-red-400";
                document.getElementById('menu').classList.add('loja-fechada');
                document.getElementById('aviso-fechado').classList.remove('hidden');
            }
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            // Ordena categorias conforme definido no Admin
            const categoriasOrdenadas = DATA.config.categorias.sort((a,b) => (a.ordem || 0) - (b.ordem || 0));

            container.innerHTML = categoriasOrdenadas.map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat.nome && i.ativo);
                if(!itens.length) return '';
                return `
                <section class="mb-10">
                    <h2 class="text-xl font-black italic uppercase text-slate-800 mb-6 px-2 tracking-tighter">${cat.nome}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${itens.map(p => `
                        <div onclick="abrirProduto(${p.id})" class="bg-white p-4 rounded-[2.5rem] flex items-center border border-slate-100 shadow-sm active:scale-95 transition-all cursor-pointer">
                            <img src="${p.imagem}" class="w-20 h-20 object-cover rounded-3xl shadow-sm">
                            <div class="ml-4 flex-1">
                                <h3 class="font-bold text-slate-800 text-sm leading-tight">${p.nome}</h3>
                                <p class="text-blue-600 font-black text-xs mt-1 italic">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                            <div class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-slate-300"><i class="fa-solid fa-plus text-xs"></i></div>
                        </div>`).join('')}
                    </div>
                </section>`;
            }).join('');
        }

        function abrirProduto(id) {
            itemAtual = JSON.parse(JSON.stringify(DATA.items.find(x => x.id === id)));
            qtd = 1;
            document.getElementById('m-img').src = itemAtual.imagem;
            document.getElementById('m-nome').innerText = itemAtual.nome;
            document.getElementById('m-desc').innerText = itemAtual.descricao || '';
            document.getElementById('m-qtd').innerText = qtd;
            document.getElementById('m-obs').value = "";

            // Lógica: Mostrar ou Ocultar Observação conforme o Admin
            document.getElementById('m-box-obs').style.display = (itemAtual.permiteObs === false) ? 'none' : 'block';

            const adsBox = document.getElementById('m-lista-ads');
            adsBox.innerHTML = "";

            // Renderiza Grupos com Trava de Limite (Ex: Pastel)
            if (itemAtual.gruposAdicionais && itemAtual.gruposAdicionais.length > 0) {
                adsBox.innerHTML = itemAtual.gruposAdicionais.map((grupo, gIdx) => `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="text-[10px] font-black uppercase text-blue-600 tracking-widest">${grupo.nome}</h4>
                            <span class="text-[9px] font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full italic">Escolha ${grupo.limite}</span>
                        </div>
                        <div class="space-y-2">
                            ${grupo.itens.map((ad, iIdx) => `
                                <div class="flex justify-between items-center bg-slate-50/50 p-4 rounded-2xl border border-transparent hover:border-blue-100 transition-all">
                                    <span class="text-xs font-bold text-slate-700">${ad.nome || ad} ${ad.preco > 0 ? '<span class="text-emerald-500 ml-1">+ R$'+ad.preco.toFixed(2)+'</span>' : ''}</span>
                                    <div class="flex items-center gap-4">
                                        <button onclick="updateAd(${gIdx}, ${iIdx}, -1)" class="w-8 h-8 bg-white rounded-xl shadow-sm font-bold">-</button>
                                        <span id="ad-qtd-${gIdx}-${iIdx}" class="font-black text-xs w-4 text-center">0</span>
                                        <button onclick="updateAd(${gIdx}, ${iIdx}, 1)" class="w-8 h-8 bg-white rounded-xl shadow-sm font-bold text-blue-600">+</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }

            updateTotalModal();
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        // Lógica de Trava de Adicionais por Grupo
        function updateAd(gIdx, iIdx, delta) {
            const grupo = itemAtual.gruposAdicionais[gIdx];
            const item = grupo.itens[iIdx];
            if(!item.qtd) item.qtd = 0;

            const totalNoGrupo = grupo.itens.reduce((acc, cur) => acc + (cur.qtd || 0), 0);

            if(delta > 0 && totalNoGrupo >= grupo.limite) {
                return alert("Limite atingido para " + grupo.nome);
            }

            if(item.qtd + delta >= 0) {
                item.qtd += delta;
                document.getElementById(`ad-qtd-${gIdx}-${iIdx}`).innerText = item.qtd;
                updateTotalModal();
            }
        }

        function updateTotalModal() {
            let precoUnitario = itemAtual.preco;
            if(itemAtual.gruposAdicionais) {
                itemAtual.gruposAdicionais.forEach(g => {
                    g.itens.forEach(i => { if(i.qtd) precoUnitario += ((i.preco || 0) * i.qtd); });
                });
            }
            document.getElementById('m-btn-add').innerText = `Adicionar R$ ${(precoUnitario * qtd).toFixed(2)}`;
        }

        function updateQtd(d) { qtd = Math.max(1, qtd + d); document.getElementById('m-qtd').innerText = qtd; updateTotalModal(); }

        function adicionarAoCarrinho() {
            let txtOpcionais = "";
            let valorProdutoComAds = itemAtual.preco;

            (itemAtual.gruposAdicionais || []).forEach(g => {
                g.itens.filter(i => i.qtd > 0).forEach(i => {
                    txtOpcionais += `\n- ${i.qtd}x ${i.nome || i}`;
                    valorProdutoComAds += ((i.preco || 0) * i.qtd);
                });
            });

            carrinho.push({
                nome: itemAtual.nome + txtOpcionais,
                preco: valorProdutoComAds * qtd,
                qtd: qtd,
                obs: document.getElementById('m-obs').value
            });

            fecharModal('modal-produto');
            updateBarraCarrinho();
        }

        function updateBarraCarrinho() {
            const total = carrinho.reduce((a,b) => a+b.preco, 0);
            document.getElementById('cart-total').innerText = "R$ " + total.toFixed(2);
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('bar-carrinho').classList.toggle('hidden', carrinho.length === 0);
        }

        function abrirCheckout() {
            document.getElementById('c-nome').value = localStorage.getItem('c_nome') || '';
            document.getElementById('c-end').value = localStorage.getItem('c_end') || '';
            document.getElementById('modal-checkout').classList.remove('hidden');
        }

        function finalizarWhatsApp() {
            const nome = document.getElementById('c-nome').value;
            const end = document.getElementById('c-end').value;
            if(!nome || !end) return alert("Preencha Nome e Endereço!");

            localStorage.setItem('c_nome', nome);
            localStorage.setItem('c_end', end);

            let msg = `*🚀 NOVO PEDIDO*\n*Cliente:* ${nome}\n*Endereço:* ${end}\n\n`;
            carrinho.forEach(i => {
                msg += `✅ *${i.qtd}x ${i.nome}*\n${i.obs ? '_Obs: '+i.obs+'_\n' : ''}\n`;
            });
            
            const totalFinal = carrinho.reduce((a,b) => a+b.preco, 0) + (DATA.config.taxaEntrega || 0);
            msg += `*TAXA ENTREGA:* R$ ${DATA.config.taxaEntrega.toFixed(2)}\n`;
            msg += `*TOTAL DO PEDIDO: R$ ${totalFinal.toFixed(2)}*`;

            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

        init();
        // Atualiza o status da loja a cada 1 minuto sem recarregar a página
        setInterval(atualizarStatusLoja, 60000);
    </script>
</body>
</html>
