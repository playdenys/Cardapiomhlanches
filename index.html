<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-24">
    <header class="bg-white p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center">
        <h1 id="ui-nome" class="font-bold text-lg">Carregando...</h1>
        <div id="status-loja" class="text-[10px] font-bold px-2 py-1 rounded-full border">---</div>
    </header>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-4"></main>

    <div id="modal-produto" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-3xl p-6 space-y-4 overflow-y-auto max-h-[90vh]">
            <div id="detalhe-conteudo"></div>
        </div>
    </div>

    <div id="bar-carrinho" class="fixed bottom-6 left-4 right-4 hidden z-40">
        <button onclick="enviarPedido()" class="w-full bg-emerald-600 text-white p-4 rounded-2xl font-bold flex justify-between shadow-xl">
            <span id="btn-texto">Ver Pedido</span>
            <span id="cart-total">R$ 0,00</span>
        </button>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let adicionaisEscolhidos = [];

        async function init() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
            renderMenu(); renderStatus();
        }

        function verificarAberto() {
            if(DATA.config.fechadoManual) return false;
            const agora = new Date(); const minAt = agora.getHours()*60 + agora.getMinutes();
            const [hA, mA] = DATA.config.horaAbre.split(':').map(Number); const [hF, mF] = DATA.config.horaFecha.split(':').map(Number);
            let minA = hA*60+mA; let minF = hF*60+mF; if(minF < minA) minF += 1440;
            return minAt >= minA && minAt <= minF;
        }

        function renderStatus() {
            const s = document.getElementById('status-loja');
            const ab = verificarAberto();
            s.innerText = ab ? "ABERTO" : "FECHADO (AGENDANDO)";
            s.className = ab ? "text-green-600 border-green-200 bg-green-50 px-2 py-1 rounded-full text-[10px] font-bold" : "text-amber-600 border-amber-200 bg-amber-50 px-2 py-1 rounded-full text-[10px] font-bold";
        }

        function renderMenu() {
            document.getElementById('menu').innerHTML = DATA.items.map(p => `
                <div onclick="abrir(${p.id})" class="bg-white p-3 rounded-2xl flex gap-4 border shadow-sm cursor-pointer">
                    <div class="flex-1"><h3 class="font-bold">${p.nome}</h3><p class="text-xs text-slate-400">${p.descricao || ''}</p><p class="mt-2 font-bold text-emerald-600">R$ ${p.preco.toFixed(2)}</p></div>
                    <img src="${p.imagem}" class="w-20 h-20 rounded-xl object-cover">
                </div>`).join('');
        }

        function abrir(id) {
            const p = DATA.items.find(i => i.id === id);
            adicionaisEscolhidos = [];
            let ads = (p.adicionais || []).map(a => `
                <label class="flex justify-between items-center p-3 border rounded-xl mb-2">
                    <span class="text-sm">${a.nome} (+R$ ${a.preco.toFixed(2)})</span>
                    <input type="checkbox" onchange="toggleAd('${a.nome}', ${a.preco}, ${p.preco})" class="w-5 h-5">
                </label>`).join('');

            document.getElementById('detalhe-conteudo').innerHTML = `
                <h2 class="text-xl font-bold">${p.nome}</h2>
                <div class="py-4">${ads}</div>
                <button onclick="addCar(${p.id})" class="w-full bg-red-500 text-white p-4 rounded-xl font-bold">Adicionar • R$ <span id="val-mod">${p.preco.toFixed(2)}</span></button>
                <button onclick="document.getElementById('modal-produto').classList.add('hidden')" class="w-full text-slate-400 font-bold p-2">Cancelar</button>
            `;
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        function toggleAd(n, pr, base) {
            const i = adicionaisEscolhidos.findIndex(a => a.nome === n);
            if(i > -1) adicionaisEscolhidos.splice(i,1); else adicionaisEscolhidos.push({nome:n, preco:pr});
            const tot = base + adicionaisEscolhidos.reduce((acc,a)=>acc+a.preco, 0);
            document.getElementById('val-mod').innerText = tot.toFixed(2);
        }

        function addCar(id) {
            const p = DATA.items.find(i => i.id === id);
            const tot = p.preco + adicionaisEscolhidos.reduce((acc,a)=>acc+a.preco, 0);
            const n = p.nome + (adicionaisEscolhidos.length ? " ("+adicionaisEscolhidos.map(a=>a.nome).join(', ')+")" : "");
            carrinho.push({nome: n, preco: tot});
            document.getElementById('modal-produto').classList.add('hidden');
            updBar();
        }

        function updBar() {
            const tot = carrinho.reduce((acc, i) => acc + i.preco, 0) + DATA.config.taxaEntrega;
            document.getElementById('cart-total').innerText = "R$ " + tot.toFixed(2);
            document.getElementById('bar-carrinho').classList.remove('hidden');
            document.getElementById('btn-texto').innerText = verificarAberto() ? "Finalizar Pedido" : "Enviar Agendamento";
        }

        function enviarPedido() {
            const ab = verificarAberto();
            let msg = `*${ab ? 'NOVO PEDIDO' : 'AGENDAMENTO'}*\n\n`;
            carrinho.forEach(i => msg += `✅ ${i.nome} - R$ ${i.preco.toFixed(2)}\n`);
            msg += `\n*Entrega:* R$ ${DATA.config.taxaEntrega.toFixed(2)}`;
            msg += `\n*TOTAL: R$ ${(carrinho.reduce((acc,i)=>acc+i.preco, 0) + DATA.config.taxaEntrega).toFixed(2)}*`;
            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }
        init();
    </script>
</body>
</html>
