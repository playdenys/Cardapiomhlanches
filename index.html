<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery VIP - Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; --brand: #ef4444; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:active { transform: scale(0.97); }
        .modal-slide { animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalSlide { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .gradient-overlay { background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 50%); }
    </style>
</head>
<body class="text-slate-900 pb-32">

    <header class="glass sticky top-0 z-50 border-b border-white/20 px-4 py-3">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <img id="ui-logo" src="" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-sm hidden">
                    <div id="dot-status" class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white"></div>
                </div>
                <div>
                    <h1 id="ui-nome" class="font-extrabold text-lg tracking-tight leading-none text-slate-800 italic uppercase">Carregando...</h1>
                    <span id="ui-status-text" class="text-[10px] font-bold uppercase tracking-wider">Verificando...</span>
                </div>
            </div>
            <div class="bg-slate-100 w-9 h-9 rounded-full flex items-center justify-center text-slate-500 shadow-inner">
                <i class="fa-solid fa-utensils text-xs"></i>
            </div>
        </div>
    </header>

    <section class="max-w-2xl mx-auto px-4 mt-6">
        <div id="banner-bg" class="bg-slate-900 rounded-[2.5rem] p-8 text-white relative overflow-hidden shadow-2xl shadow-slate-200">
            <div class="relative z-10">
                <h2 class="text-2xl font-black italic italic leading-tight">Faça seu pedido <br>com facilidade!</h2>
                <p class="text-slate-400 text-xs mt-2 font-medium">Os melhores sabores preparados com carinho.</p>
            </div>
            <i class="fa-solid fa-burger absolute -right-6 -bottom-6 text-8xl text-white/5 -rotate-12"></i>
        </div>
    </section>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-12 mt-6">
        </main>

    <footer class="mt-12 mb-20 text-center px-6">
        <div class="w-12 h-1 bg-slate-200 mx-auto rounded-full mb-6"></div>
        <p id="ui-footer" class="text-slate-400 text-[11px] leading-relaxed max-w-xs mx-auto italic font-medium"></p>
        <p class="text-[9px] text-slate-300 uppercase tracking-[0.2em] mt-6 font-black">Sistema Delivery VIP</p>
    </footer>

    <div id="bar-carrinho" class="fixed bottom-8 left-0 right-0 z-40 hidden px-4">
        <div class="max-w-md mx-auto bg-slate-950 rounded-[2.2rem] p-2 shadow-2xl flex items-center justify-between border border-white/10 backdrop-blur-md">
            <div class="flex items-center gap-4 pl-5">
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping text-white text-lg"></i>
                    <span id="cart-count" class="absolute -top-3 -right-3 bg-red-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-950">0</span>
                </div>
                <div>
                    <p class="text-slate-500 text-[9px] font-black uppercase tracking-widest leading-none">Subtotal</p>
                    <p id="cart-total" class="text-white font-black text-lg leading-none mt-1">R$ 0,00</p>
                </div>
            </div>
            <button onclick="enviarWhatsApp()" class="bg-white text-slate-900 h-14 px-8 rounded-[1.8rem] font-black uppercase text-[10px] tracking-widest hover:bg-slate-100 active:scale-95 transition">
                Finalizar Pedido
            </button>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-slate-950/70 z-[60] hidden backdrop-blur-sm flex items-end justify-center">
        <div class="bg-white w-full max-w-xl rounded-t-[3.5rem] overflow-hidden modal-slide max-h-[92vh] flex flex-col">
            <div class="relative h-72 w-full">
                <img id="modal-img" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 gradient-overlay"></div>
                <button onclick="fecharModal()" class="absolute top-6 right-6 bg-white/20 backdrop-blur-md text-white w-11 h-11 rounded-full flex items-center justify-center border border-white/20">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-10 py-8">
                <div class="flex justify-between items-start">
                    <h2 id="modal-nome" class="text-2xl font-black text-slate-800 leading-none"></h2>
                    <span id="modal-preco-base" class="text-xl font-bold text-emerald-600 italic"></span>
                </div>
                <p id="modal-desc" class="text-slate-500 mt-4 text-sm leading-relaxed font-medium"></p>
                <div id="container-adicionais" class="mt-8 space-y-4"></div>
            </div>
            <div class="p-10 border-t border-slate-100 bg-slate-50/50">
                <button onclick="confirmarAdicao()" id="btn-add-modal" class="w-full h-16 rounded-[2rem] font-black text-white shadow-xl flex justify-between items-center px-10 active:scale-95 transition" style="background-color: var(--brand);">
                    <span class="uppercase tracking-widest text-[10px]">Adicionar à Sacola</span>
                    <span id="val-modal-total" class="text-xl"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let adicionaisEscolhidos = []; let produtoAberto = null;

        async function init() {
            try {
                const res = await fetch('produtos.json', { cache: 'no-store' });
                DATA = await res.json();
                document.body.style.setProperty('--brand', DATA.config.corPrincipal);
                document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
                document.getElementById('ui-footer').innerText = DATA.config.footerText || "";
                if(DATA.config.linkLogo) {
                    const img = document.getElementById('ui-logo');
                    img.src = DATA.config.linkLogo; img.classList.remove('hidden');
                }
                renderStatus(); renderMenu();
            } catch(e) { document.getElementById('ui-nome').innerText = "Cardápio Indisponível"; }
        }

        function verificarAberto() {
            if(DATA.config.fechadoManual) return false;
            const agora = new Date(); const minAt = agora.getHours()*60 + agora.getMinutes();
            const [hA, mA] = DATA.config.horaAbre.split(':').map(Number);
            const [hF, mF] = DATA.config.horaFecha.split(':').map(Number);
            let minA = hA*60+mA, minF = hF*60+mF; if(minF < minA) minF += 1440;
            return minAt >= minA && minAt <= minF;
        }

        function renderStatus() {
            const dot = document.getElementById('dot-status'); const txt = document.getElementById('ui-status-text');
            const aberto = verificarAberto();
            dot.className = `absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${aberto ? 'bg-emerald-500' : 'bg-amber-500'}`;
            txt.innerText = aberto ? 'Aberto' : 'Fechado / Agende';
            txt.className = `text-[10px] font-black uppercase tracking-widest ${aberto ? 'text-emerald-500' : 'text-amber-500'}`;
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            container.innerHTML = (DATA.config.categorias || []).map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat);
                if(!itens.length) return '';
                return `
                <section>
                    <div class="flex items-center gap-4 mb-6">
                        <div class="h-2 w-10 rounded-full" style="background-color: var(--brand)"></div>
                        <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter italic">${cat}</h2>
                    </div>
                    <div class="grid gap-6">
                        ${itens.map(p => {
                            const esgotado = p.ativo === false;
                            return `
                            <div ${esgotado ? '' : `onclick="abrirProduto(${p.id})"`} class="product-card group bg-white rounded-[2.5rem] flex items-center p-3 shadow-sm border border-slate-100 relative ${esgotado ? 'opacity-60 grayscale' : 'cursor-pointer hover:shadow-xl hover:shadow-slate-200/50'}">
                                <div class="relative h-28 w-28 flex-shrink-0">
                                    <img src="${p.imagem}" class="w-full h-full object-cover rounded-[2rem] shadow-md border-2 border-white">
                                    ${!esgotado ? `<div class="absolute -bottom-1 -right-1 w-9 h-9 bg-slate-950 text-white rounded-full shadow-lg flex items-center justify-center text-xs border-2 border-white"><i class="fa-solid fa-plus"></i></div>` : ''}
                                </div>
                                <div class="ml-5 flex-1 pr-2">
                                    <h3 class="font-bold text-slate-800 leading-snug group-hover:text-red-500 transition">${p.nome}</h3>
                                    <p class="text-[11px] text-slate-400 mt-1 line-clamp-2 font-medium">${p.descricao || ''}</p>
                                    <p class="text-emerald-600 font-black mt-2 italic text-sm">R$ ${p.preco.toFixed(2)}</p>
                                </div>
                                ${esgotado ? `<div class="absolute inset-0 flex items-center justify-center"><span class="bg-slate-900 text-white text-[9px] font-black px-4 py-1.5 rounded-full shadow-2xl border border-white/20">INDISPONÍVEL</span></div>` : ''}
                            </div>`
                        }).join('')}
                    </div>
                </section>`;
            }).join('');
        }

        function abrirProduto(id) {
            produtoAberto = DATA.items.find(i => i.id === id); adicionaisEscolhidos = [];
            document.getElementById('modal-img').src = produtoAberto.imagem;
            document.getElementById('modal-nome').innerText = produtoAberto.nome;
            document.getElementById('modal-desc').innerText = produtoAberto.descricao || '';
            document.getElementById('modal-preco-base').innerText = `R$ ${produtoAberto.preco.toFixed(2)}`;
            const containerAds = document.getElementById('container-adicionais');
            containerAds.innerHTML = (produtoAberto.adicionais || []).length ? `<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-4">Escolha seus complementos</p>` : '';
            (produtoAberto.adicionais || []).forEach(ad => {
                containerAds.innerHTML += `
                    <label class="flex justify-between items-center bg-slate-50 p-5 rounded-[1.5rem] border border-transparent cursor-pointer active:scale-95 transition has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50/50">
                        <div class="flex items-center gap-4">
                            <input type="checkbox" onchange="toggleAd('${ad.nome}', ${ad.preco})" class="w-6 h-6 accent-emerald-500 rounded-lg">
                            <span class="text-sm font-bold text-slate-700">${ad.nome}</span>
                        </div>
                        <span class="text-xs font-black text-emerald-600">+ R$ ${ad.preco.toFixed(2)}</span>
                    </label>`;
            });
            atualizarTotalModal(); document.getElementById('modal-produto').classList.remove('hidden'); document.body.style.overflow = 'hidden';
        }

        function toggleAd(n, p) {
            const i = adicionaisEscolhidos.findIndex(a => a.nome === n);
            if(i > -1) adicionaisEscolhidos.splice(i, 1); else adicionaisEscolhidos.push({ nome: n, preco: p });
            atualizarTotalModal();
        }

        function atualizarTotalModal() {
            const total = produtoAberto.preco + adicionaisEscolhidos.reduce((acc, a) => acc + a.preco, 0);
            document.getElementById('val-modal-total').innerText = `R$ ${total.toFixed(2)}`;
        }

        function confirmarAdicao() {
            const totalItem = produtoAberto.preco + adicionaisEscolhidos.reduce((acc, a) => acc + a.preco, 0);
            const nomeFinal = adicionaisEscolhidos.length ? `${produtoAberto.nome} (+${adicionaisEscolhidos.map(a=>a.nome).join(',')})` : produtoAberto.nome;
            carrinho.push({ nome: nomeFinal, preco: totalItem });
            fecharModal(); atualizarBarra();
        }

        function atualizarBarra() {
            const totalFinal = carrinho.reduce((acc, i) => acc + i.preco, 0) + (DATA.config.taxaEntrega || 0);
            document.getElementById('cart-total').innerText = "R$ " + totalFinal.toFixed(2);
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('bar-carrinho').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modal-produto').classList.add('hidden'); document.body.style.overflow = 'auto'; }

        function enviarWhatsApp() {
            const ab = verificarAberto();
            let msg = `*${ab ? '🚀 NOVO PEDIDO' : '📅 AGENDAMENTO'}*\n━━━━━━━━━━━━━━━━━━━━\n\n`;
            carrinho.forEach(i => msg += `✅ *1x ${i.nome}*\n   _R$ ${i.preco.toFixed(2)}_\n\n`);
            msg += `━━━━━━━━━━━━━━━━━━━━\n🛵 *Entrega:* R$ ${DATA.config.taxaEntrega.toFixed(2)}\n`;
            msg += `💰 *TOTAL: R$ ${(carrinho.reduce((acc,i)=>acc+i.preco, 0) + DATA.config.taxaEntrega).toFixed(2)}*`;
            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        init();
    </script>
</body>
</html>
