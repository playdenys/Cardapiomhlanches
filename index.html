<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; --brand: #e11d48; }
        .product-card:active { transform: scale(0.97); }
        .modal-slide { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .tab-half { border-bottom: 3px solid var(--brand); font-weight: 800; color: #1e293b; }
    </style>
</head>
<body class="pb-40">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b p-4">
        <div class="max-w-2xl mx-auto flex items-center gap-3">
            <img id="ui-logo" src="" class="w-12 h-12 rounded-2xl object-cover border hidden">
            <div>
                <h1 id="ui-nome" class="font-black text-lg italic text-slate-800 tracking-tight uppercase">Carregando...</h1>
                <span id="ui-status-text" class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Verificando...</span>
            </div>
        </div>
    </header>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-12 mt-6"></main>

    <div id="bar-carrinho" class="fixed bottom-8 left-0 right-0 z-40 hidden px-4">
        <div class="max-w-md mx-auto bg-slate-900 rounded-[2.5rem] p-2 shadow-2xl flex items-center justify-between border border-white/10">
            <div class="pl-6 flex items-center gap-4 text-white">
                <span id="cart-count" class="bg-red-500 text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
                <p id="cart-total" class="font-black text-lg">R$ 0,00</p>
            </div>
            <button onclick="enviarWhatsApp()" class="bg-white text-slate-900 h-14 px-10 rounded-[2.2rem] font-black uppercase text-[10px]">Finalizar</button>
        </div>
    </div>

    <div id="modal-meio" class="fixed inset-0 bg-black/70 z-[70] hidden flex items-end justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] overflow-hidden modal-slide h-[95vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center"><h2 class="font-black italic uppercase">Montar Meio a Meio</h2><button onclick="fecharMeio()"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <div class="flex p-4 gap-4 bg-slate-50">
                <button id="tab-lado1" onclick="abaMeio=1; renderSaboresMeio()" class="flex-1 py-3 text-center text-xs tab-half">LADO 1: <span id="txt-lado1" class="block font-black text-[10px]">ESCOLHER</span></button>
                <button id="tab-lado2" onclick="abaMeio=2; renderSaboresMeio()" class="flex-1 py-3 text-center text-xs">LADO 2: <span id="txt-lado2" class="block font-black text-[10px]">ESCOLHER</span></button>
            </div>
            <div id="lista-sabores" class="flex-1 overflow-y-auto p-6 space-y-3"></div>
            <div class="p-8 border-t bg-slate-50">
                <div class="flex justify-between mb-4"><span class="text-xs font-bold text-slate-400">PREÇO (MÉDIA)</span><span id="preco-meio" class="font-black text-xl text-emerald-600">R$ 0,00</span></div>
                <button id="btn-confirm-meio" disabled onclick="confirmarMeio()" class="w-full py-5 rounded-[2.2rem] font-black text-white bg-slate-300">ADICIONAR PIZZA</button>
            </div>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-black/70 z-[60] hidden flex items-end justify-center">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] overflow-hidden modal-slide max-h-[92vh] flex flex-col">
            <div class="p-8 overflow-y-auto flex-1">
                <h2 id="modal-nome" class="text-2xl font-black text-slate-800 uppercase italic mb-2"></h2>
                <p id="modal-desc" class="text-slate-400 text-sm mb-6"></p>
                <div id="container-ads" class="space-y-3"></div>
                <textarea id="modal-obs" placeholder="Observações..." class="w-full bg-slate-50 rounded-2xl p-4 text-sm mt-6 h-24 outline-none"></textarea>
            </div>
            <div class="p-8 border-t flex gap-4 bg-white">
                <button onclick="fecharModal()" class="text-slate-400 font-bold uppercase text-xs">Sair</button>
                <button onclick="confirmarAdd()" class="flex-1 py-5 rounded-[2.2rem] font-black text-white" style="background: var(--brand)">CONFIRMAR <span id="val-modal-total"></span></button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let addsEscolhidos = []; let prodAberto = null;
        let abaMeio = 1; let lado1 = null; let lado2 = null; let catAtiva = "";

        async function init() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            document.body.style.setProperty('--brand', DATA.config.corPrincipal);
            document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
            if(DATA.config.linkLogo) { document.getElementById('ui-logo').src = DATA.config.linkLogo; document.getElementById('ui-logo').classList.remove('hidden'); }
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            // Respeita a ordem exata do array de categorias no JSON
            container.innerHTML = (DATA.config.categorias || []).map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat.nome);
                if(!itens.length) return '';

                return `
                <section>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-black italic uppercase tracking-tighter">${cat.nome}</h2>
                        ${cat.meioAMeio ? `<button onclick="abrirMeio('${cat.nome}')" class="bg-slate-900 text-white px-4 py-2 rounded-2xl text-[10px] font-black uppercase">🍕 Montar Meio a Meio</button>` : ''}
                    </div>
                    <div class="grid gap-4">
                        ${itens.map(p => `
                        <div onclick="${p.ativo ? `abrirProduto(${p.id})` : ''}" class="product-card bg-white p-3 rounded-[2rem] flex items-center border border-slate-100 ${!p.ativo ? 'opacity-40 grayscale' : 'cursor-pointer'}">
                            <img src="${p.imagem}" class="w-24 h-24 object-cover rounded-2xl shadow-sm">
                            <div class="ml-4 flex-1">
                                <h3 class="font-bold text-slate-800 text-sm">${p.nome}</h3>
                                <p class="text-emerald-600 font-black text-sm mt-1">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                        </div>`).join('')}
                    </div>
                </section>`;
            }).join('');
        }

        // --- PIZZA MEIO A MEIO ---
        function abrirMeio(cat) {
            catAtiva = cat; abaMeio = 1; lado1 = null; lado2 = null;
            document.getElementById('txt-lado1').innerText = "ESCOLHER";
            document.getElementById('txt-lado2').innerText = "ESCOLHER";
            document.getElementById('preco-meio').innerText = "R$ 0,00";
            renderSaboresMeio();
            document.getElementById('modal-meio').classList.remove('hidden');
        }

        function renderSaboresMeio() {
            const container = document.getElementById('lista-sabores');
            const itens = DATA.items.filter(i => i.categoria === catAtiva && i.ativo);
            
            document.getElementById('tab-lado1').className = `flex-1 py-3 text-center text-xs ${abaMeio === 1 ? 'tab-half' : ''}`;
            document.getElementById('tab-lado2').className = `flex-1 py-3 text-center text-xs ${abaMeio === 2 ? 'tab-half' : ''}`;

            container.innerHTML = itens.map(p => `
                <div onclick="setLado(${p.id})" class="p-4 bg-white border rounded-2xl flex justify-between items-center active:bg-slate-50">
                    <span class="font-bold text-sm">${p.nome}</span>
                    <span class="text-[10px] font-black text-emerald-600">R$ ${p.preco.toFixed(2)}</span>
                </div>`).join('');
        }

        function setLado(id) {
            const p = DATA.items.find(x => x.id === id);
            if(abaMeio === 1) { lado1 = p; document.getElementById('txt-lado1').innerText = p.nome; abaMeio = 2; }
            else { lado2 = p; document.getElementById('txt-lado2').innerText = p.nome; }
            
            if(lado1 && lado2) {
                const media = (lado1.preco + lado2.preco) / 2;
                document.getElementById('preco-meio').innerText = `R$ ${media.toFixed(2)}`;
                const btn = document.getElementById('btn-confirm-meio');
                btn.disabled = false; btn.className = "w-full py-5 rounded-[2.2rem] font-black text-white shadow-xl bg-emerald-500";
            }
            renderSaboresMeio();
        }

        function confirmarMeio() {
            const media = (lado1.preco + lado2.preco) / 2;
            carrinho.push({ nome: `PIZZA ½ ${lado1.nome} / ½ ${lado2.nome}`, preco: media, obs: "Meio a Meio" });
            fecharMeio(); updateBar();
        }

        function fecharMeio() { document.getElementById('modal-meio').classList.add('hidden'); }

        // --- PADRÃO ---
        function abrirProduto(id) {
            prodAberto = DATA.items.find(x => x.id === id); addsEscolhidos = [];
            document.getElementById('modal-nome').innerText = prodAberto.nome;
            document.getElementById('modal-desc').innerText = prodAberto.descricao || '';
            document.getElementById('modal-obs').value = "";
            
            const container = document.getElementById('container-ads');
            container.innerHTML = (prodAberto.adicionais || []).map((ad, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-3xl border">
                    <span class="text-xs font-bold">${ad.nome} (+ R$ ${ad.preco.toFixed(2)})</span>
                    <div class="flex items-center gap-3">
                        <button onclick="mudarQtdAd(${i}, -1)" class="w-8 h-8 rounded-full border">-</button>
                        <span id="qtd-ad-${i}" class="font-bold text-xs">0</span>
                        <button onclick="mudarQtdAd(${i}, 1)" class="w-8 h-8 rounded-full bg-slate-900 text-white">+</button>
                    </div>
                </div>`).join('');
            updateTotalModal();
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        function mudarQtdAd(idx, delta) {
            const ad = prodAberto.adicionais[idx];
            const el = document.getElementById(`qtd-ad-${idx}`);
            let qtd = parseInt(el.innerText);
            
            if(delta > 0) {
                const totalAtual = addsEscolhidos.reduce((a,b) => a+b.qtd, 0);
                if(totalAtual >= (prodAberto.limiteAdicionais || 99)) return;
                if(qtd >= (ad.maxPorItem || 1)) return;
                qtd++;
            } else { if(qtd > 0) qtd--; }

            el.innerText = qtd;
            const f = addsEscolhidos.findIndex(x => x.nome === ad.nome);
            if(qtd > 0) { if(f > -1) addsEscolhidos[f].qtd = qtd; else addsEscolhidos.push({nome: ad.nome, preco: ad.preco, qtd}); }
            else { if(f > -1) addsEscolhidos.splice(f, 1); }
            updateTotalModal();
        }

        function updateTotalModal() {
            const t = prodAberto.preco + addsEscolhidos.reduce((a,b) => a+(b.preco*b.qtd), 0);
            document.getElementById('val-modal-total').innerText = `R$ ${t.toFixed(2)}`;
        }

        function confirmarAdd() {
            const t = prodAberto.preco + addsEscolhidos.reduce((a,b) => a+(b.preco*b.qtd), 0);
            let n = prodAberto.nome;
            if(addsEscolhidos.length) n += ` (+ ${addsEscolhidos.map(x=>`${x.qtd}x ${x.nome}`).join(', ')})`;
            carrinho.push({ nome: n, preco: t, obs: document.getElementById('modal-obs').value });
            fecharModal(); updateBar();
        }

        function updateBar() {
            const t = carrinho.reduce((a,b) => a+b.preco, 0) + DATA.config.taxaEntrega;
            document.getElementById('cart-total').innerText = "R$ " + t.toFixed(2);
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('bar-carrinho').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modal-produto').classList.add('hidden'); }

        function enviarWhatsApp() {
            let msg = `*NOVO PEDIDO*\n\n`;
            carrinho.forEach(i => { msg += `• *1x ${i.nome}*\n${i.obs ? `  _Obs: ${i.obs}_\n` : ''}  R$ ${i.preco.toFixed(2)}\n\n`; });
            msg += `*Entrega:* R$ ${DATA.config.taxaEntrega.toFixed(2)}\n*TOTAL:* R$ ${(carrinho.reduce((a,b)=>a+b.preco,0)+DATA.config.taxaEntrega).toFixed(2)}`;
            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        init();
    </script>
</body>
</html>
