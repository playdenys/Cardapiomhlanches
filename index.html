<script>
    const STORE_CONFIG = {
        name: "Bruto's Burger",
        whatsappNumber: "5511999999999",
        deliveryFee: 5.00
    };

    // LINK PARA O SEU ARQUIVO JSON NO GITHUB
    // Exemplo: https://seu-usuario.github.io/seu-repositorio/produtos.json
    const DATA_URL = "produtos.json"; 

    async function loadProducts() {
        try {
            const response = await fetch(DATA_URL);
            const products = await response.json();
            renderMenu(products);
        } catch (error) {
            console.error("Erro ao carregar produtos:", error);
            document.getElementById('menu-container').innerHTML = "<p class='text-white text-center'>Erro ao carregar o cardápio.</p>";
        }
    }

    function renderMenu(products) {
        const container = document.getElementById('menu-container');
        // ... (Aqui vai a mesma lógica de renderização que usamos antes)
        // Ela vai percorrer a lista 'products' e criar o HTML.
        console.log("Produtos carregados:", products);
        
        // Exemplo simplificado de renderização:
        let html = '';
        products.forEach(p => {
            html += `<div class="bg-zinc-800 p-4 rounded mb-2">${p.nome} - R$ ${p.preco}</div>`;
        });
        container.innerHTML = html;
    }

    loadProducts();
</script>
