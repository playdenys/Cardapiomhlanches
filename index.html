<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital - Pedido Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; --brand: #2563eb; }
        .modal-slide { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { border-bottom: 3px solid var(--brand); font-weight: 800; color: #1e293b; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b p-4">
        <div class="max-w-2xl mx-auto flex items-center gap-3">
            <img id="ui-logo" src="" class="w-12 h-12 rounded-2xl object-cover border hidden">
            <div>
                <h1 id="ui-nome" class="font-black text-lg italic text-slate-800 tracking-tight uppercase">Carregando...</h1>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">Loja Aberta</span>
                </div>
            </div>
        </div>
    </header>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-10 mt-6"></main>

    <div id="bar-carrinho" class="fixed bottom-6 left-0 right-0 z-40 hidden px-4">
        <div class="max-w-md mx-auto bg-slate-900 rounded-[2.5rem] p-2 shadow-2xl flex items-center justify-between border border-white/10">
            <div class="pl-6 flex items-center gap-4 text-white">
                <div class="relative">
                    <i class="fa-solid fa-basket-shopping text-xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
                </div>
                <div>
                    <p class="text-[9px] font-bold text-slate-400 uppercase leading-none mb-1">Total Pedido</p>
                    <p id="cart-total" class="font-black text-lg leading-none">R$ 0,00</p>
                </div>
            </div>
            <button onclick="abrirCheckout()" class="bg-white text-slate-900 h-14 px-10 rounded-[2.2rem] font-black uppercase text-[10px] hover:bg-slate-100 transition-all">Ver Pedido</button>
        </div>
    </div>

    <div id="modal-checkout" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-end justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] overflow-hidden modal-slide h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                <h2 class="font-black italic uppercase text-slate-800">Finalizar Pedido</h2>
                <button onclick="fecharCheckout()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <div id="checkout-itens" class="space-y-2 mb-6"></div>

                <div class="space-y-4">
                    <h3 class="font-black text-xs uppercase text-slate-400 tracking-widest">Seus Dados</h3>
                    <input type="text" id="cli-nome" placeholder="Seu Nome Completo" class="w-full bg-slate-100 p-4 rounded-2xl outline-none focus:ring-2 ring-blue-500 font-bold">
                </div>

                <div class="space-y-4">
                    <h3 class="font-black text-xs uppercase text-slate-400 tracking-widest">Tipo de Entrega</h3>
                    <div class="flex gap-2">
                        <button onclick="setEntrega('entrega')" id="btn-entrega" class="flex-1 py-4 rounded-2xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm">Entrega</button>
                        <button onclick="setEntrega('retirada')" id="btn-retirada" class="flex-1 py-4 rounded-2xl border-2 border-transparent bg-slate-100 text-slate-500 font-bold text-sm">Retirada</button>
                    </div>
                    
                    <div id="campo-endereco" class="space-y-3">
                        <input type="text" id="cli-end" placeholder="Rua, Número e Bairro" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold">
                        <input type="text" id="cli-ref" placeholder="Ponto de Referência (Opcional)" class="w-full bg-slate-100 p-4 rounded-2xl outline-none">
                    </div>
                </div>

                <div class="space-y-4 pb-10">
                    <h3 class="font-black text-xs uppercase text-slate-400 tracking-widest">Pagamento</h3>
                    <select id="cli-pagto" onchange="toggleTroco()" class="w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold appearance-none">
                        <option value="Pix">Pix (Rápido)</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                    <input type="text" id="cli-troco" placeholder="Troco para quanto?" class="hidden w-full bg-slate-100 p-4 rounded-2xl outline-none font-bold">
                </div>
            </div>

            <div class="p-8 border-t bg-white">
                <button onclick="enviarWhatsApp()" class="w-full py-5 rounded-[2.2rem] font-black text-white bg-emerald-600 shadow-xl shadow-emerald-100 uppercase text-xs tracking-widest">
                    Enviar Pedido via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let tipoEntrega = 'entrega';

        async function init() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            document.body.style.setProperty('--brand', DATA.config.corPrincipal);
            document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
            if(DATA.config.linkLogo) { document.getElementById('ui-logo').src = DATA.config.linkLogo; document.getElementById('ui-logo').classList.remove('hidden'); }
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            container.innerHTML = (DATA.config.categorias || []).map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat.nome && i.ativo);
                if(!itens.length) return '';
                return `
                <section>
                    <div class="flex justify-between items-center mb-4 px-2">
                        <h2 class="text-xl font-black italic uppercase text-slate-800">${cat.nome}</h2>
                        ${cat.meioAMeio ? `<button onclick="abrirMeio('${cat.nome}')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase shadow-lg shadow-blue-100"><i class="fa-solid fa-pizza-slice mr-1"></i> Meio a Meio</button>` : ''}
                    </div>
                    <div class="space-y-3">
                        ${itens.map(p => `
                        <div onclick="abrirProduto(${p.id})" class="bg-white p-3 rounded-[2rem] flex items-center border border-slate-100 shadow-sm active:scale-95 transition-all">
                            <img src="${p.imagem}" class="w-20 h-20 object-cover rounded-2xl">
                            <div class="ml-4 flex-1">
                                <h3 class="font-bold text-slate-800 text-sm">${p.nome}</h3>
                                <p class="text-slate-400 text-[10px] line-clamp-1 mb-1">${p.descricao || ''}</p>
                                <p class="text-emerald-600 font-black text-sm">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                        </div>`).join('')}
                    </div>
                </section>`;
            }).join('');
        }

        // --- FUNÇÕES DE CHECKOUT ---
        function abrirCheckout() {
            const container = document.getElementById('checkout-itens');
            container.innerHTML = carrinho.map((item, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="flex-1">
                        <p class="font-bold text-xs text-slate-800">${item.nome}</p>
                        <p class="text-[10px] text-emerald-600 font-black">R$ ${item.preco.toFixed(2)}</p>
                    </div>
                    <button onclick="removerCarrinho(${i})" class="text-red-400 p-2"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
            document.getElementById('modal-checkout').classList.remove('hidden');
        }

        function setEntrega(tipo) {
            tipoEntrega = tipo;
            const isEntrega = tipo === 'entrega';
            document.getElementById('btn-entrega').className = isEntrega ? "flex-1 py-4 rounded-2xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm" : "flex-1 py-4 rounded-2xl border-2 border-transparent bg-slate-100 text-slate-500 font-bold text-sm";
            document.getElementById('btn-retirada').className = !isEntrega ? "flex-1 py-4 rounded-2xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm" : "flex-1 py-4 rounded-2xl border-2 border-transparent bg-slate-100 text-slate-500 font-bold text-sm";
            document.getElementById('campo-endereco').classList.toggle('hidden', !isEntrega);
            updateBar();
        }

        function toggleTroco() {
            const pagto = document.getElementById('cli-pagto').value;
            document.getElementById('cli-troco').classList.toggle('hidden', pagto !== 'Dinheiro');
        }

        function enviarWhatsApp() {
            const nome = document.getElementById('cli-nome').value;
            const end = document.getElementById('cli-end').value;
            const ref = document.getElementById('cli-ref').value;
            const pagto = document.getElementById('cli-pagto').value;
            const troco = document.getElementById('cli-troco').value;

            if(!nome) return alert("Por favor, informe seu nome.");
            if(tipoEntrega === 'entrega' && !end) return alert("Por favor, informe o endereço de entrega.");

            let texto = `*🍔 NOVO PEDIDO - ${DATA.config.nomeLoja.toUpperCase()}*\n`;
            texto += `------------------------------------------\n`;
            texto += `*CLIENTE:* ${nome}\n`;
            texto += `*TIPO:* ${tipoEntrega.toUpperCase()}\n`;
            if(tipoEntrega === 'entrega') {
                texto += `*ENDEREÇO:* ${end}\n`;
                if(ref) texto += `*REF:* ${ref}\n`;
            }
            texto += `------------------------------------------\n\n`;
            
            carrinho.forEach(item => {
                texto += `✅ *1x ${item.nome}*\n`;
                if(item.obs) texto += `   _Obs: ${item.obs}_\n`;
                texto += `   R$ ${item.preco.toFixed(2)}\n\n`;
            });

            const taxa = tipoEntrega === 'entrega' ? DATA.config.taxaEntrega : 0;
            const total = carrinho.reduce((a, b) => a + b.preco, 0) + taxa;

            texto += `------------------------------------------\n`;
            if(tipoEntrega === 'entrega') texto += `*TAXA DE ENTREGA:* R$ ${taxa.toFixed(2)}\n`;
            texto += `*TOTAL DO PEDIDO:* R$ ${total.toFixed(2)}\n`;
            texto += `------------------------------------------\n`;
            texto += `*PAGAMENTO:* ${pagto}\n`;
            if(pagto === 'Dinheiro' && troco) texto += `*TROCO PARA:* R$ ${troco}\n`;
            
            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(texto)}`);
        }

        // [As outras funções de controle de carrinho, modais de adicionais etc seguem a mesma lógica anterior]
        function updateBar() {
            const taxa = tipoEntrega === 'entrega' ? DATA.config.taxaEntrega : 0;
            const t = carrinho.reduce((a,b) => a+b.preco, 0) + taxa;
            document.getElementById('cart-total').innerText = "R$ " + t.toFixed(2);
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('bar-carrinho').classList.toggle('hidden', carrinho.length === 0);
        }

        function removerCarrinho(i) {
            carrinho.splice(i, 1);
            abrirCheckout();
            updateBar();
            if(carrinho.length === 0) fecharCheckout();
        }

        function fecharCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }
        init();
    </script>
</body>
</html>
