<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style id="custom-theme"> </style>
</head>
<body class="bg-zinc-950 text-white font-[Poppins] pb-20">

    <header class="p-10 text-center flex flex-col items-center">
        <img id="ui-logo" src="" class="w-24 h-24 rounded-full mb-4 hidden border-4 border-white/10 shadow-xl">
        <h1 id="ui-nome" class="text-3xl font-bold">...</h1>
    </header>

    <main id="menu" class="container mx-auto px-4 max-w-2xl space-y-10">
        </main>

    <script>
        async function carregar() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            const data = await res.json();
            
            // Aplicar Configurações Visuais
            document.getElementById('ui-nome').innerText = data.config.nomeLoja;
            if(data.config.linkLogo) {
                const img = document.getElementById('ui-logo');
                img.src = data.config.linkLogo;
                img.classList.remove('hidden');
            }

            // Aplicar Cores Dinâmicas
            document.getElementById('custom-theme').innerHTML = `
                .text-brand { color: ${data.config.corPrincipal} }
                .bg-brand { background-color: ${data.config.corPrincipal} }
                .border-brand { border-color: ${data.config.corPrincipal} }
            `;

            renderizar(data.items);
        }

        function renderizar(items) {
            const container = document.getElementById('menu');
            container.innerHTML = "";
            
            const cats = [...new Set(items.map(i => i.categoria))];
            cats.forEach(cat => {
                let section = `<div class="mb-8"><h2 class="text-xl font-bold mb-4 uppercase tracking-widest text-brand border-b border-white/10 pb-2">${cat}</h2>`;
                items.filter(i => i.categoria === cat).forEach(p => {
                    section += `
                        <div class="flex gap-4 p-3 bg-zinc-900/50 rounded-2xl mb-3 border border-white/5 shadow-lg">
                            <img src="${p.imagem}" class="w-20 h-20 object-cover rounded-xl shadow-md">
                            <div class="flex-1 flex flex-col justify-center">
                                <h3 class="font-bold text-lg">${p.nome}</h3>
                                <p class="font-bold text-brand">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                            <button onclick="fazerPedido('${p.nome}')" class="bg-brand text-white w-10 h-10 rounded-full my-auto flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus">+</i></button>
                        </div>
                    `;
                });
                section += `</div>`;
                container.innerHTML += section;
            });
        }
        
        carregar();
    </script>
</body>
</html>
