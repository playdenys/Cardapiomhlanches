<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; --brand: #2563eb; }
        .modal-slide { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input, select, textarea { -webkit-appearance: none; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b p-4">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <img id="ui-logo" src="" class="w-14 h-14 rounded-2xl object-cover border hidden shadow-sm">
            <div class="flex-1">
                <h1 id="ui-nome" class="font-black text-xl italic text-slate-800 uppercase tracking-tighter">Carregando...</h1>
                <div class="flex items-center gap-2">
                    <span id="status-cor" class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span id="status-txt" class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Loja Aberta</span>
                </div>
            </div>
        </div>
    </header>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-10 mt-4"></main>

    <div id="bar-carrinho" class="fixed bottom-6 left-0 right-0 z-40 hidden px-4">
        <div class="max-w-md mx-auto bg-slate-900 rounded-[2.5rem] p-2 shadow-2xl flex items-center justify-between border border-white/10">
            <div class="pl-6 flex items-center gap-4 text-white">
                <div class="relative">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
                </div>
                <div>
                    <p class="text-[9px] font-bold text-slate-400 uppercase leading-none mb-1">Subtotal</p>
                    <p id="cart-total" class="font-black text-lg leading-none text-white">R$ 0,00</p>
                </div>
            </div>
            <button onclick="abrirCheckout()" class="bg-white text-slate-900 h-14 px-10 rounded-[2.2rem] font-black uppercase text-[10px] hover:scale-105 transition-all">Finalizar</button>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-end justify-center backdrop-blur-sm p-0 md:p-4">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] md:rounded-[3rem] overflow-hidden modal-slide max-h-[95vh] flex flex-col">
            <div class="relative h-64 w-full">
                <img id="m-img" src="" class="w-full h-full object-cover">
                <button onclick="fecharModal('modal-produto')" class="absolute top-6 right-6 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-8 overflow-y-auto flex-1 space-y-6">
                <div>
                    <h2 id="m-nome" class="text-2xl font-black text-slate-800"></h2>
                    <p id="m-desc" class="text-slate-400 text-sm mt-2"></p>
                </div>
                <div id="m-lista-ads" class="space-y-4"></div>
                <textarea id="m-obs" placeholder="Alguma observação? (Ex: Sem cebola, ponto da carne...)" class="w-full bg-slate-100 p-5 rounded-3xl h-28 outline-none text-sm font-medium focus:ring-2 ring-blue-500 transition-all"></textarea>
            </div>
            <div class="p-8 border-t bg-white flex items-center gap-4">
                <div class="flex items-center bg-slate-100 rounded-2xl p-1">
                    <button onclick="updateQtd(-1)" class="w-10 h-10 font-bold text-xl">-</button>
                    <span id="m-qtd" class="w-10 text-center font-black">1</span>
                    <button onclick="updateQtd(1)" class="w-10 h-10 font-bold text-xl">+</button>
                </div>
                <button onclick="adicionarAoCarrinho()" id="m-btn-add" class="flex-1 h-14 rounded-2xl bg-blue-600 text-white font-black uppercase text-xs tracking-widest shadow-lg shadow-blue-100">Adicionar</button>
            </div>
        </div>
    </div>

    <div id="modal-meio" class="fixed inset-0 bg-black/70 z-[110] hidden flex items-end justify-center backdrop-blur-sm p-0 md:p-4">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] md:rounded-[3rem] overflow-hidden modal-slide h-[90vh] flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="font-black italic uppercase text-slate-800 tracking-tighter">Pizza Meio a Meio</h2>
                <button onclick="fecharModal('modal-meio')" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 flex-1 overflow-y-auto space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div id="m-p1" class="border-2 border-dashed p-4 rounded-3xl text-center bg-slate-50 transition-all">
                        <p class="text-[9px] font-black text-slate-400 uppercase">1ª Metade</p>
                        <p id="m-p1-nome" class="font-bold text-xs mt-1 text-blue-600">Escolha...</p>
                    </div>
                    <div id="m-p2" class="border-2 border-dashed p-4 rounded-3xl text-center bg-slate-50 transition-all">
                        <p class="text-[9px] font-black text-slate-400 uppercase">2ª Metade</p>
                        <p id="m-p2-nome" class="font-bold text-xs mt-1 text-blue-600">Escolha...</p>
                    </div>
                </div>
                <div id="m-lista-pizzas" class="space-y-2"></div>
            </div>
            <div class="p-8 border-t bg-white">
                <button onclick="addMeioCarrinho()" id="btn-add-meio" class="w-full h-14 rounded-2xl bg-slate-900 text-white font-black uppercase text-xs tracking-widest opacity-50 transition-all" disabled>Escolha as metades</button>
            </div>
        </div>
    </div>

    <div id="modal-checkout" class="fixed inset-0 bg-black/70 z-[120] hidden flex items-end justify-center backdrop-blur-sm p-0 md:p-4">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] md:rounded-[3rem] overflow-hidden modal-slide h-[90vh] flex flex-col">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h2 class="font-black italic uppercase text-slate-800">Finalizar Pedido</h2>
                <button onclick="fecharModal('modal-checkout')" class="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-8 overflow-y-auto flex-1 space-y-8">
                <div class="space-y-4">
                    <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2"><i class="fa-solid fa-user"></i> Seus Dados</h3>
                    <input type="text" id="c-nome" placeholder="Seu Nome Completo" class="w-full bg-slate-100 p-5 rounded-3xl outline-none focus:ring-2 ring-blue-500 font-bold">
                </div>

                <div class="space-y-4">
                    <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2"><i class="fa-solid fa-truck"></i> Forma de Entrega</h3>
                    <div class="flex gap-3">
                        <button onclick="setEntrega('entrega')" id="b-entrega" class="flex-1 py-4 rounded-3xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm">Entrega</button>
                        <button onclick="setEntrega('retirada')" id="b-retirada" class="flex-1 py-4 rounded-3xl border-2 border-transparent bg-slate-100 text-slate-500 font-bold text-sm">Retirada</button>
                    </div>
                    <div id="box-endereco" class="space-y-3">
                        <input type="text" id="c-end" placeholder="Rua, Número e Bairro" class="w-full bg-slate-100 p-5 rounded-3xl outline-none font-bold">
                        <input type="text" id="c-ref" placeholder="Ponto de Referência (Próximo a...)" class="w-full bg-slate-100 p-5 rounded-3xl outline-none">
                    </div>
                </div>

                <div class="space-y-4 pb-12">
                    <h3 class="text-[10px] font-black uppercase text-slate-400 tracking-widest flex items-center gap-2"><i class="fa-solid fa-credit-card"></i> Pagamento</h3>
                    <select id="c-pagto" onchange="toggleTroco()" class="w-full bg-slate-100 p-5 rounded-3xl outline-none font-bold appearance-none">
                        <option value="Pix">Pix</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                    <input type="text" id="c-troco" placeholder="Troco para quanto?" class="hidden w-full bg-slate-100 p-5 rounded-3xl outline-none font-bold">
                </div>
            </div>
            <div class="p-8 border-t bg-white">
                <button onclick="enviarWhatsApp()" class="w-full py-6 rounded-[2.5rem] bg-emerald-600 text-white font-black uppercase text-xs tracking-widest shadow-xl shadow-emerald-200 active:scale-95 transition-all">
                    Enviar Pedido via WhatsApp <i class="fa-brands fa-whatsapp ml-2 text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let itemAtual = null; let qtd = 1;
        let metades = []; let tipoEntrega = 'entrega';

        async function init() {
            try {
                const res = await fetch('produtos.json', { cache: 'no-store' });
                DATA = await res.json();
                
                document.body.style.setProperty('--brand', DATA.config.corPrincipal);
                document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
                if(DATA.config.linkLogo) { 
                    const img = document.getElementById('ui-logo');
                    img.src = DATA.config.linkLogo; 
                    img.classList.remove('hidden'); 
                }
                
                if(DATA.config.fechadoManual) {
                    document.getElementById('status-cor').className = "w-2 h-2 rounded-full bg-red-500";
                    document.getElementById('status-txt').innerText = "Loja Fechada";
                }

                renderMenu();
            } catch(e) { console.error("Erro ao carregar JSON:", e); }
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            container.innerHTML = DATA.config.categorias.map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat.nome && i.ativo);
                if(!itens.length) return '';
                return `
                <section>
                    <div class="flex justify-between items-end mb-6 px-2">
                        <h2 class="text-2xl font-black italic uppercase text-slate-800 tracking-tighter">${cat.nome}</h2>
                        ${cat.meioAMeio ? `<button onclick="abrirMeio('${cat.nome}')" class="bg-blue-600 text-white px-5 py-2.5 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-blue-100"><i class="fa-solid fa-pizza-slice mr-2"></i> Meio a Meio</button>` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${itens.map(p => `
                        <div onclick="abrirProduto(${p.id})" class="bg-white p-4 rounded-[2.5rem] flex items-center border border-slate-100 shadow-sm active:scale-95 transition-all cursor-pointer">
                            <img src="${p.imagem}" class="w-24 h-24 object-cover rounded-3xl shadow-md bg-slate-50">
                            <div class="ml-4 flex-1">
                                <h3 class="font-bold text-slate-800 text-sm leading-tight">${p.nome}</h3>
                                <p class="text-slate-400 text-[10px] line-clamp-2 mt-1">${p.descricao || ''}</p>
                                <p class="text-emerald-600 font-black text-sm mt-2">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                        </div>`).join('')}
                    </div>
                </section>`;
            }).join('');
        }

        // --- PRODUTO SIMPLES E ADICIONAIS ---
        function abrirProduto(id) {
            itemAtual = JSON.parse(JSON.stringify(DATA.items.find(x => x.id === id)));
            qtd = 1;
            document.getElementById('m-img').src = itemAtual.imagem;
            document.getElementById('m-nome').innerText = itemAtual.nome;
            document.getElementById('m-desc').innerText = itemAtual.descricao;
            document.getElementById('m-qtd').innerText = qtd;
            document.getElementById('m-obs').value = "";
            
            const adsBox = document.getElementById('m-lista-ads');
            adsBox.innerHTML = (itemAtual.adicionais || []).map((ad, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-[1.5rem]">
                    <div>
                        <p class="font-bold text-xs">${ad.nome}</p>
                        <p class="text-[10px] text-emerald-600 font-black">+ R$ ${ad.preco.toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-3 bg-white p-1 rounded-xl shadow-sm">
                        <button onclick="updateAd(${i}, -1)" class="w-8 h-8 font-bold text-lg">-</button>
                        <span id="ad-qtd-${i}" class="font-black text-xs w-4 text-center">0</span>
                        <button onclick="updateAd(${i}, 1)" class="w-8 h-8 font-bold text-lg">+</button>
                    </div>
                </div>
            `).join('');
            
            updateTotalModal();
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        function updateAd(idx, delta) {
            const ad = itemAtual.adicionais[idx];
            const novaQtd = (ad.qtd || 0) + delta;
            if(novaQtd >= 0 && novaQtd <= (ad.maxPorItem || 5)) {
                ad.qtd = novaQtd;
                document.getElementById(`ad-qtd-${idx}`).innerText = novaQtd;
                updateTotalModal();
            }
        }

        function updateTotalModal() {
            let totalUnitario = itemAtual.preco;
            (itemAtual.adicionais || []).forEach(ad => totalUnitario += (ad.preco * (ad.qtd || 0)));
            document.getElementById('m-btn-add').innerText = `Adicionar R$ ${(totalUnitario * qtd).toFixed(2)}`;
        }

        function updateQtd(delta) {
            qtd = Math.max(1, qtd + delta);
            document.getElementById('m-qtd').innerText = qtd;
            updateTotalModal();
        }

        function adicionarAoCarrinho() {
            const ads = (itemAtual.adicionais || []).filter(a => a.qtd > 0);
            let subNome = ads.length ? " (" + ads.map(a => `${a.qtd}x ${a.nome}`).join(', ') + ")" : "";
            let precoComAds = itemAtual.preco;
            ads.forEach(a => precoComAds += (a.preco * a.qtd));

            for(let i=0; i<qtd; i++) {
                carrinho.push({ 
                    nome: itemAtual.nome + subNome, 
                    preco: precoComAds, 
                    obs: document.getElementById('m-obs').value 
                });
            }
            fecharModal('modal-produto');
            updateBar();
        }

        // --- MEIO A MEIO ---
        function abrirMeio(cat) {
            metades = [];
            document.getElementById('m-p1-nome').innerText = "Escolha...";
            document.getElementById('m-p2-nome').innerText = "Escolha...";
            document.getElementById('m-p1').className = "border-2 border-dashed p-4 rounded-3xl text-center bg-slate-50 transition-all";
            document.getElementById('m-p2').className = "border-2 border-dashed p-4 rounded-3xl text-center bg-slate-50 transition-all";
            document.getElementById('btn-add-meio').disabled = true;
            document.getElementById('btn-add-meio').className = "w-full h-14 rounded-2xl bg-slate-900 text-white font-black uppercase text-xs tracking-widest opacity-50";

            const pizzas = DATA.items.filter(i => i.categoria === cat && i.ativo);
            document.getElementById('m-lista-pizzas').innerHTML = pizzas.map(p => `
                <div onclick="selectMetade(${p.id})" class="p-4 border-2 border-slate-100 rounded-[1.5rem] flex justify-between items-center bg-white active:bg-blue-50 transition-all cursor-pointer">
                    <span class="font-bold text-xs">${p.nome}</span>
                    <span class="font-black text-xs text-emerald-600">R$ ${(p.preco/2).toFixed(2)}</span>
                </div>
            `).join('');
            document.getElementById('modal-meio').classList.remove('hidden');
        }

        function selectMetade(id) {
            const p = DATA.items.find(x => x.id === id);
            if(metades.length < 2) {
                metades.push(p);
                const n = metades.length;
                document.getElementById(`m-p${n}-nome`).innerText = p.nome;
                document.getElementById(`m-p${n}`).className = "border-2 border-blue-600 p-4 rounded-3xl text-center bg-blue-50 transition-all scale-105";
            }
            if(metades.length === 2) {
                const btn = document.getElementById('btn-add-meio');
                btn.disabled = false;
                btn.className = "w-full h-14 rounded-2xl bg-blue-600 text-white font-black uppercase text-xs tracking-widest shadow-lg";
                const totalMeio = (metades[0].preco + metades[1].preco) / 2;
                btn.innerText = `Adicionar R$ ${totalMeio.toFixed(2)}`;
            }
        }

        function addMeioCarrinho() {
            const total = (metades[0].preco + metades[1].preco) / 2;
            carrinho.push({ nome: `1/2 ${metades[0].nome} + 1/2 ${metades[1].nome}`, preco: total });
            fecharModal('modal-meio');
            updateBar();
        }

        // --- CHECKOUT COM LOCAL STORAGE ---
        function abrirCheckout() {
            // RECUPERA DADOS SALVOS
            const nS = localStorage.getItem('c_nome');
            const eS = localStorage.getItem('c_end');
            const rS = localStorage.getItem('c_ref');

            if (nS) document.getElementById('c-nome').value = nS;
            if (eS) document.getElementById('c-end').value = eS;
            if (rS) document.getElementById('c-ref').value = rS;

            document.getElementById('modal-checkout').classList.remove('hidden');
        }

        function setEntrega(t) {
            tipoEntrega = t;
            const isE = t === 'entrega';
            document.getElementById('b-entrega').className = isE ? "flex-1 py-4 rounded-3xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm" : "flex-1 py-4 rounded-3xl border-2 border-transparent bg-slate-100 text-slate-500 font-bold text-sm";
            document.getElementById('b-retirada').className = !isE ? "flex-1 py-4 rounded-3xl border-2 border-blue-600 bg-blue-50 text-blue-600 font-bold text-sm" : "flex-1 py-4 rounded-3xl border-2 border-transparent bg-slate-100 text-slate-500 font-bold text-sm";
            document.getElementById('box-endereco').classList.toggle('hidden', !isE);
        }

        function toggleTroco() {
            document.getElementById('c-troco').classList.toggle('hidden', document.getElementById('c-pagto').value !== 'Dinheiro');
        }

        function updateBar() {
            const t = carrinho.reduce((a,b) => a+b.preco, 0);
            document.getElementById('cart-total').innerText = "R$ " + t.toFixed(2);
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('bar-carrinho').classList.toggle('hidden', carrinho.length === 0);
        }

        function fecharModal(id) { document.getElementById(id).classList.add('hidden'); }

        function enviarWhatsApp() {
            const nome = document.getElementById('c-nome').value;
            const end = document.getElementById('c-end').value;
            const ref = document.getElementById('c-ref').value;
            const pagto = document.getElementById('c-pagto').value;
            const troco = document.getElementById('c-troco').value;

            if(!nome) return alert("Por favor, informe seu nome.");
            if(tipoEntrega === 'entrega' && !end) return alert("Informe seu endereço.");

            // SALVA DADOS NO NAVEGADOR
            localStorage.setItem('c_nome', nome);
            localStorage.setItem('c_end', end);
            localStorage.setItem('c_ref', ref);

            let msg = `*🚀 NOVO PEDIDO - ${DATA.config.nomeLoja.toUpperCase()}*\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `*👤 CLIENTE:* ${nome}\n`;
            msg += `*🛵 TIPO:* ${tipoEntrega.toUpperCase()}\n`;
            if(tipoEntrega === 'entrega') {
                msg += `*📍 ENDEREÇO:* ${end}\n`;
                if(ref) msg += `*🏁 REF:* ${ref}\n`;
            }
            msg += `━━━━━━━━━━━━━━━━━━━━━━\n\n`;

            carrinho.forEach(i => {
                msg += `✅ *1x ${i.nome}*\n`;
                if(i.obs) msg += `   _Obs: ${i.obs}_\n`;
                msg += `   R$ ${i.preco.toFixed(2)}\n\n`;
            });

            const taxa = tipoEntrega === 'entrega' ? (DATA.config.taxaEntrega || 0) : 0;
            const total = carrinho.reduce((a,b) => a+b.preco, 0) + taxa;

            msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            if(taxa > 0) msg += `*TAXA ENTREGA:* R$ ${taxa.toFixed(2)}\n`;
            msg += `*💰 TOTAL:* R$ ${total.toFixed(2)}\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `*💳 PAGAMENTO:* ${pagto}\n`;
            if(troco) msg += `*💵 TROCO PARA:* R$ ${troco}\n`;

            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        init();
    </script>
</body>
</html>
