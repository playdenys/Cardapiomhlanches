<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery VIP - Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; --brand: #ef4444; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:active { transform: scale(0.97); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .modal-slide { animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalSlide { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .gradient-overlay { background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 50%); }
    </style>
</head>
<body class="text-slate-900">

    <header class="glass sticky top-0 z-50 border-b border-white/20 px-4 py-3">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <img id="ui-logo" src="" class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-sm hidden">
                    <div id="dot-status" class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white"></div>
                </div>
                <div>
                    <h1 id="ui-nome" class="font-extrabold text-lg tracking-tight leading-none text-slate-800">Carregando...</h1>
                    <span id="ui-status-text" class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Verificando...</span>
                </div>
            </div>
            <button class="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center text-slate-600 shadow-inner">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
        </div>
    </header>

    <section class="max-w-2xl mx-auto px-4 mt-6">
        <div class="bg-slate-900 rounded-[2rem] p-6 text-white relative overflow-hidden shadow-xl shadow-slate-200">
            <div class="relative z-10">
                <h2 class="text-2xl font-black italic">Bateu aquela fome?</h2>
                <p class="text-slate-400 text-sm mt-1">Os melhores sabores a um clique.</p>
            </div>
            <i class="fa-solid fa-utensils absolute -right-4 -bottom-4 text-7xl text-white/5 -rotate-12"></i>
        </div>
    </section>

    <main id="menu" class="max-w-2xl mx-auto p-4 space-y-10 mt-4">
        </main>

    <div id="bar-carrinho" class="fixed bottom-8 left-0 right-0 z-40 hidden px-4">
        <div class="max-w-md mx-auto bg-slate-900 rounded-[2rem] p-2 shadow-2xl flex items-center justify-between border border-white/10">
            <div class="flex items-center gap-4 pl-4">
                <div class="relative">
                    <i class="fa-solid fa-bag-shopping text-white text-xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
                </div>
                <div>
                    <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest leading-none">Total do Pedido</p>
                    <p id="cart-total" class="text-white font-bold text-lg leading-none mt-1">R$ 0,00</p>
                </div>
            </div>
            <button onclick="enviarWhatsApp()" class="bg-white text-slate-900 h-14 px-8 rounded-[1.5rem] font-black uppercase text-xs tracking-widest hover:bg-slate-100 transition active:scale-95">
                Finalizar
            </button>
        </div>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-slate-950/60 z-[60] hidden backdrop-blur-sm flex items-end justify-center">
        <div class="bg-white w-full max-w-xl rounded-t-[3rem] overflow-hidden modal-slide max-h-[92vh] flex flex-col">
            <div class="relative h-64 w-full">
                <img id="modal-img" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 gradient-overlay"></div>
                <button onclick="fecharModal()" class="absolute top-6 right-6 bg-white/20 backdrop-blur-md text-white w-10 h-10 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-8 py-6">
                <div class="flex justify-between items-start">
                    <h2 id="modal-nome" class="text-2xl font-black text-slate-800 leading-tight"></h2>
                    <span id="modal-preco-base" class="text-xl font-bold text-emerald-600 italic"></span>
                </div>
                <p id="modal-desc" class="text-slate-500 mt-3 text-sm leading-relaxed"></p>
                
                <div id="container-adicionais" class="mt-8 space-y-4">
                    </div>
            </div>

            <div class="p-8 border-t border-slate-100 bg-slate-50/50">
                <button onclick="confirmarAdicao()" class="w-full h-16 rounded-[1.5rem] font-black text-white shadow-lg shadow-red-200 flex justify-between items-center px-8 transition active:scale-95" id="btn-add-modal" style="background-color: var(--brand);">
                    <span class="uppercase tracking-widest text-xs">Adicionar ao Carrinho</span>
                    <span id="val-modal-total" class="text-lg"></span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let DATA = {}; let carrinho = []; let adicionaisEscolhidos = []; let produtoAberto = null;

        async function init() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            document.body.style.setProperty('--brand', DATA.config.corPrincipal);
            document.getElementById('ui-nome').innerText = DATA.config.nomeLoja;
            if(DATA.config.linkLogo) {
                const img = document.getElementById('ui-logo');
                img.src = DATA.config.linkLogo; img.classList.remove('hidden');
            }
            renderStatus(); renderMenu();
        }

        function verificarAberto() {
            if(DATA.config.fechadoManual) return false;
            const agora = new Date(); const minAt = agora.getHours()*60 + agora.getMinutes();
            const [hA, mA] = DATA.config.horaAbre.split(':').map(Number);
            const [hF, mF] = DATA.config.horaFecha.split(':').map(Number);
            let minA = hA*60+mA, minF = hF*60+mF; if(minF < minA) minF += 1440;
            return minAt >= minA && minAt <= minF;
        }

        function renderStatus() {
            const dot = document.getElementById('dot-status');
            const txt = document.getElementById('ui-status-text');
            const aberto = verificarAberto();
            dot.className = `absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white ${aberto ? 'bg-emerald-500' : 'bg-amber-500'}`;
            txt.innerText = aberto ? 'Aberto Agora' : 'Fechado (Agende)';
            txt.className = `text-[10px] font-bold uppercase tracking-wider ${aberto ? 'text-emerald-500' : 'text-amber-500'}`;
        }

        function renderMenu() {
            const container = document.getElementById('menu');
            container.innerHTML = (DATA.config.categorias || []).map(cat => {
                const itens = DATA.items.filter(i => i.categoria === cat);
                if(!itens.length) return '';
                return `
                <section>
                    <div class="flex items-center gap-3 mb-5">
                        <div class="h-6 w-1 rounded-full" style="background-color: var(--brand)"></div>
                        <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter italic">${cat}</h2>
                    </div>
                    <div class="grid gap-6">
                        ${itens.map(p => {
                            const esgotado = p.ativo === false;
                            return `
                            <div ${esgotado ? '' : `onclick="abrirProduto(${p.id})"`} class="product-card group bg-white rounded-[2rem] flex items-center p-3 shadow-sm border border-slate-100 relative ${esgotado ? 'opacity-60 grayscale' : 'cursor-pointer hover:shadow-xl hover:shadow-slate-200/50'}">
                                <div class="relative h-24 w-24 flex-shrink-0">
                                    <img src="${p.imagem}" class="w-full h-full object-cover rounded-[1.5rem] shadow-md">
                                    ${!esgotado ? `<div class="absolute -bottom-2 -right-2 w-8 h-8 bg-white rounded-full shadow-lg flex items-center justify-center text-slate-800 text-xs"><i class="fa-solid fa-plus"></i></div>` : ''}
                                </div>
                                <div class="ml-5 flex-1">
                                    <h3 class="font-bold text-slate-800 leading-tight group-hover:text-red-500 transition">${p.nome}</h3>
                                    <p class="text-[11px] text-slate-400 mt-1 line-clamp-2 leading-relaxed">${p.descricao || ''}</p>
                                    <p class="text-emerald-600 font-extrabold mt-2 italic text-sm">R$ ${p.preco.toFixed(2)}</p>
                                </div>
                                ${esgotado ? `<div class="absolute inset-0 flex items-center justify-center"><span class="bg-slate-900 text-white text-[10px] font-black px-3 py-1 rounded-lg rotate-12 shadow-xl">ESGOTADO</span></div>` : ''}
                            </div>`
                        }).join('')}
                    </div>
                </section>`;
            }).join('');
        }

        function abrirProduto(id) {
            produtoAberto = DATA.items.find(i => i.id === id);
            adicionaisEscolhidos = [];
            document.getElementById('modal-img').src = produtoAberto.imagem;
            document.getElementById('modal-nome').innerText = produtoAberto.nome;
            document.getElementById('modal-desc').innerText = produtoAberto.descricao || '';
            document.getElementById('modal-preco-base').innerText = `R$ ${produtoAberto.preco.toFixed(2)}`;
            
            const containerAds = document.getElementById('container-adicionais');
            containerAds.innerHTML = (produtoAberto.adicionais || []).length ? `<p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Adicionais Sugeridos</p>` : '';
            
            (produtoAberto.adicionais || []).forEach((ad, idx) => {
                containerAds.innerHTML += `
                    <label class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-transparent cursor-pointer transition active:bg-slate-100 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-50/50">
                        <div class="flex items-center gap-4">
                            <input type="checkbox" onchange="toggleAd('${ad.nome}', ${ad.preco})" class="w-6 h-6 accent-emerald-500 rounded-lg">
                            <span class="text-sm font-bold text-slate-700">${ad.nome}</span>
                        </div>
                        <span class="text-xs font-black text-emerald-600">+ R$ ${ad.preco.toFixed(2)}</span>
                    </label>`;
            });

            atualizarTotalModal();
            document.getElementById('modal-produto').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function toggleAd(nome, preco) {
            const i = adicionaisEscolhidos.findIndex(a => a.nome === nome);
            if(i > -1) adicionaisEscolhidos.splice(i, 1);
            else adicionaisEscolhidos.push({ nome, preco });
            atualizarTotalModal();
        }

        function atualizarTotalModal() {
            const total = produtoAberto.preco + adicionaisEscolhidos.reduce((acc, a) => acc + a.preco, 0);
            document.getElementById('val-modal-total').innerText = `R$ ${total.toFixed(2)}`;
        }

        function confirmarAdicao() {
            const totalItem = produtoAberto.preco + adicionaisEscolhidos.reduce((acc, a) => acc + a.preco, 0);
            const nomeFinal = adicionaisEscolhidos.length ? `${produtoAberto.nome} (+${adicionaisEscolhidos.map(a=>a.nome).join(',')})` : produtoAberto.nome;
            carrinho.push({ nome: nomeFinal, preco: totalItem });
            fecharModal(); atualizarBarra();
        }

        function atualizarBarra() {
            const totalFinal = carrinho.reduce((acc, i) => acc + i.preco, 0) + (DATA.config.taxaEntrega || 0);
            document.getElementById('cart-total').innerText = "R$ " + totalFinal.toFixed(2);
            document.getElementById('cart-count').innerText = carrinho.length;
            document.getElementById('bar-carrinho').classList.remove('hidden');
        }

        function fecharModal() { document.getElementById('modal-produto').classList.add('hidden'); document.body.style.overflow = 'auto'; }

        function enviarWhatsApp() {
            const ab = verificarAberto();
            let msg = `*${ab ? '🚀 NOVO PEDIDO' : '📅 AGENDAMENTO'}*\n`;
            msg += `_Total de Itens: ${carrinho.length}_\n`;
            msg += `━━━━━━━━━━━━━━━━━━━━\n\n`;
            carrinho.forEach(i => msg += `• *1x ${i.nome}*\n  _R$ ${i.preco.toFixed(2)}_\n\n`);
            msg += `━━━━━━━━━━━━━━━━━━━━\n`;
            msg += `🛵 *Entrega:* R$ ${DATA.config.taxaEntrega.toFixed(2)}\n`;
            msg += `💰 *TOTAL: R$ ${(carrinho.reduce((acc,i)=>acc+i.preco, 0) + DATA.config.taxaEntrega).toFixed(2)}*\n\n`;
            if(!ab) msg += `⚠️ _Agendamento para abertura._`;
            window.open(`https://wa.me/${DATA.config.whatsapp}?text=${encodeURIComponent(msg)}`);
        }

        init();
    </script>
</body>
</html>
