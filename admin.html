<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Delivery Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-20">

    <div id="setup" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full">
            <h1 class="text-2xl font-bold mb-6 text-center text-slate-800">Painel Admin</h1>
            <input type="password" id="gh-token" placeholder="GitHub Token (ghp_...)" class="w-full border-2 p-3 rounded-xl mb-3 outline-none focus:border-blue-500">
            <input type="text" id="gh-repo" placeholder="usuario/repositorio" class="w-full border-2 p-3 rounded-xl mb-6 outline-none focus:border-blue-500">
            <button onclick="carregarDadosAtuais()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 shadow-lg transition">Acessar Painel</button>
        </div>
    </div>

    <div id="editor" class="hidden">
        <header class="bg-white border-b sticky top-0 z-40 p-4 shadow-sm">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <h2 id="display-loja" class="font-bold text-slate-800 text-xl italic text-red-500">Admin Pro</h2>
                <button onclick="salvarNoGithub()" id="btn-salvar" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-emerald-700 shadow-md">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Publicar Alterações
                </button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
            
            <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <h3 class="font-bold text-slate-700 col-span-full border-b pb-2 text-lg italic"><i class="fa-solid fa-gears mr-2"></i>Configurações Gerais</h3>
                
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Nome da Loja</label>
                    <input type="text" id="cfg-nome" class="w-full bg-slate-50 p-3 rounded-xl border mt-1 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">WhatsApp (Ex: 55119...)</label>
                    <input type="text" id="cfg-zap" class="w-full bg-slate-50 p-3 rounded-xl border mt-1 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Taxa de Entrega (R$)</label>
                    <input type="number" id="cfg-taxa" step="0.01" class="w-full bg-slate-50 p-3 rounded-xl border mt-1 font-bold text-emerald-600 outline-none">
                </div>
                
                <div class="md:col-span-2 flex items-center gap-4 bg-slate-50 p-4 rounded-xl border">
                    <div class="flex-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Horário de Funcionamento</label>
                        <div class="flex items-center gap-2 mt-1">
                            <input type="time" id="cfg-abre" class="p-2 rounded-lg border outline-none">
                            <span>às</span>
                            <input type="time" id="cfg-fecha" class="p-2 rounded-lg border outline-none">
                        </div>
                    </div>
                    <div class="border-l pl-4">
                        <label class="text-[10px] font-bold text-red-400 uppercase">Loja Fechada Agora?</label>
                        <div class="mt-1 flex items-center gap-2">
                            <input type="checkbox" id="cfg-fechado-manual" class="w-6 h-6 accent-red-500">
                            <span class="text-xs font-bold text-slate-500 italic">Forçar Fechamento</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase">Cor Principal</label>
                    <input type="color" id="cfg-cor" class="w-full h-12 rounded-xl border-none cursor-pointer mt-1">
                </div>
            </section>

            <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-700 mb-4 italic"><i class="fa-solid fa-tags mr-2 text-amber-500"></i>Categorias</h3>
                <div id="lista-categorias" class="flex flex-wrap gap-2 mb-4"></div>
                <div class="flex gap-2 max-w-sm">
                    <input type="text" id="nova-cat-nome" placeholder="Ex: Bebidas" class="flex-1 bg-slate-50 p-2 rounded-lg border outline-none">
                    <button onclick="adicionarCategoria()" class="bg-slate-800 text-white px-6 rounded-lg font-bold">+</button>
                </div>
            </section>

            <section>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-slate-700 text-lg italic"><i class="fa-solid fa-utensils mr-2 text-rose-500"></i>Meus Produtos</h3>
                    <button onclick="novoProduto()" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm hover:bg-blue-700 transition shadow-lg">
                        + Novo Produto
                    </button>
                </div>
                <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
        </main>
    </div>

    <script>
        let dadosAtuais = {};
        let shaArquivo = "";

        async function carregarDadosAtuais() {
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                shaArquivo = data.sha;
                dadosAtuais = JSON.parse(atob(data.content));

                // Preencher campos
                document.getElementById('cfg-nome').value = dadosAtuais.config.nomeLoja;
                document.getElementById('cfg-zap').value = dadosAtuais.config.whatsapp;
                document.getElementById('cfg-taxa').value = dadosAtuais.config.taxaEntrega || 0;
                document.getElementById('cfg-abre').value = dadosAtuais.config.horaAbre || "18:00";
                document.getElementById('cfg-fecha').value = dadosAtuais.config.horaFecha || "23:59";
                document.getElementById('cfg-fechado-manual').checked = dadosAtuais.config.fechadoManual || false;
                document.getElementById('cfg-cor').value = dadosAtuais.config.corPrincipal || "#ef4444";
                
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('editor').classList.remove('hidden');
                atualizarInterface();
            } catch (e) { alert("Erro ao conectar ao GitHub!"); }
        }

        function atualizarInterface() {
            renderizarCategorias();
            renderizarProdutos();
        }

        function renderizarCategorias() {
            const container = document.getElementById('lista-categorias');
            container.innerHTML = (dadosAtuais.config.categorias || []).map((cat, i) => `
                <span class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-3 border">
                    ${cat} <button onclick="removerCategoria(${i})" class="text-rose-500"><i class="fa-solid fa-xmark"></i></button>
                </span>
            `).join('');
        }

        function adicionarCategoria() {
            const nome = document.getElementById('nova-cat-nome').value.trim().toLowerCase();
            if(nome && !dadosAtuais.config.categorias.includes(nome)) {
                dadosAtuais.config.categorias.push(nome);
                document.getElementById('nova-cat-nome').value = "";
                renderizarCategorias();
                renderizarProdutos();
            }
        }

        function removerCategoria(i) {
            dadosAtuais.config.categorias.splice(i, 1);
            atualizarInterface();
        }

        function novoProduto() {
            dadosAtuais.items.unshift({
                id: Date.now(),
                nome: "Novo Item",
                preco: 0,
                descricao: "",
                imagem: "https://via.placeholder.com/300",
                categoria: dadosAtuais.config.categorias[0] || "geral"
            });
            renderizarProdutos();
        }

        function renderizarProdutos() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = dadosAtuais.items.map((p, i) => `
                <div class="bg-white border rounded-2xl p-4 shadow-sm relative group flex gap-4">
                    <img src="${p.imagem}" class="w-20 h-20 object-cover rounded-xl border">
                    <div class="flex-1 space-y-2">
                        <input type="text" onchange="editarItem(${i}, 'nome', this.value)" value="${p.nome}" class="w-full font-bold bg-transparent outline-none border-b border-dashed">
                        <textarea onchange="editarItem(${i}, 'descricao', this.value)" class="w-full text-xs text-slate-500 bg-transparent outline-none h-10">${p.descricao || ''}</textarea>
                        <div class="flex gap-2">
                            <input type="number" step="0.01" onchange="editarItem(${i}, 'preco', this.value)" value="${p.preco}" class="w-20 p-1 border rounded text-emerald-600 font-bold text-xs">
                            <select onchange="editarItem(${i}, 'categoria', this.value)" class="text-[10px] font-bold uppercase border rounded px-1">
                                ${dadosAtuais.config.categorias.map(c => `<option value="${c}" ${p.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <input type="text" onchange="editarItem(${i}, 'imagem', this.value)" value="${p.imagem}" class="w-full text-[9px] text-blue-400 bg-transparent outline-none">
                    </div>
                    <button onclick="removerItem(${i})" class="text-slate-300 hover:text-rose-500 transition"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function editarItem(i, campo, valor) {
            dadosAtuais.items[i][campo] = campo === 'preco' ? parseFloat(valor) : valor;
        }

        function removerItem(i) {
            if(confirm("Excluir item?")) {
                dadosAtuais.items.splice(i, 1);
                renderizarProdutos();
            }
        }

        async function salvarNoGithub() {
            const btn = document.getElementById('btn-salvar');
            btn.innerHTML = "Salvando...";
            btn.disabled = true;

            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;

            // Update config
            dadosAtuais.config.nomeLoja = document.getElementById('cfg-nome').value;
            dadosAtuais.config.whatsapp = document.getElementById('cfg-zap').value;
            dadosAtuais.config.taxaEntrega = parseFloat(document.getElementById('cfg-taxa').value);
            dadosAtuais.config.horaAbre = document.getElementById('cfg-abre').value;
            dadosAtuais.config.horaFecha = document.getElementById('cfg-fecha').value;
            dadosAtuais.config.fechadoManual = document.getElementById('cfg-fechado-manual').checked;
            dadosAtuais.config.corPrincipal = document.getElementById('cfg-cor').value;

            const novoConteudo = btoa(unescape(encodeURIComponent(JSON.stringify(dadosAtuais, null, 2))));

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update Admin", content: novoConteudo, sha: shaArquivo })
                });

                if(res.ok) {
                    const resData = await res.json();
                    shaArquivo = resData.content.sha;
                    alert("Sucesso! Site atualizado.");
                } else { alert("Erro ao salvar."); }
            } catch (e) { alert("Erro de conexão."); }
            
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Publicar Alterações';
            btn.disabled = false;
        }
    </script>
</body>
</html>
