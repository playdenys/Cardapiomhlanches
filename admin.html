<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro - Gestão de Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
        .tab-inactive { color: #6b7280; font-weight: 500; }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <div id="setup" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full">
            <div class="text-center mb-8">
                <i class="fa-solid fa-rocket text-4xl text-blue-600 mb-3"></i>
                <h1 class="text-2xl font-bold">Acesso ao Painel</h1>
            </div>
            <div class="space-y-4">
                <div><label class="text-xs font-bold text-slate-500 uppercase">Token do GitHub</label><input type="password" id="gh-token" class="w-full border-2 border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500"></div>
                <div><label class="text-xs font-bold text-slate-500 uppercase">Repositório (usuario/repo)</label><input type="text" id="gh-repo" class="w-full border-2 border-slate-200 p-3 rounded-xl outline-none focus:border-blue-500"></div>
                <button onclick="carregarDados()" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-lg transition">Conectar Sistema</button>
            </div>
        </div>
    </div>

    <div id="editor" class="hidden">
        <header class="bg-white border-b shadow-sm sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="header-logo" src="https://via.placeholder.com/150" class="w-8 h-8 rounded-full object-cover border">
                    <h2 id="header-nome" class="font-bold text-lg">Painel Admin</h2>
                </div>
                <button onclick="salvarNoGithub()" id="btn-salvar" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold shadow transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i> <span>Publicar Site</span>
                </button>
            </div>
            <div class="max-w-6xl mx-auto px-4 flex gap-6 mt-2">
                <button onclick="mudarAba('aba-loja')" id="nav-loja" class="pb-3 px-2 tab-active transition"><i class="fa-solid fa-store mr-2"></i>Loja</button>
                <button onclick="mudarAba('aba-categorias')" id="nav-categorias" class="pb-3 px-2 tab-inactive transition"><i class="fa-solid fa-tags mr-2"></i>Categorias</button>
                <button onclick="mudarAba('aba-produtos')" id="nav-produtos" class="pb-3 px-2 tab-inactive transition"><i class="fa-solid fa-burger mr-2"></i>Produtos</button>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 py-8">
            <section id="aba-loja" class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-palette text-blue-500"></i> Identidade Visual</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Nome da Loja</label><input type="text" id="cfg-nome" class="w-full bg-slate-50 border p-3 rounded-xl mt-1 outline-none"></div>
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Link da Logo</label><input type="text" id="cfg-logo" class="w-full bg-slate-50 border p-3 rounded-xl mt-1 outline-none"></div>
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Cor Principal</label><input type="color" id="cfg-cor" class="w-full h-12 border-none rounded-xl mt-1 cursor-pointer"></div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-motorcycle text-amber-500"></i> Operação</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-slate-500 uppercase">WhatsApp</label><input type="text" id="cfg-zap" class="w-full bg-slate-50 border p-3 rounded-xl mt-1 outline-none"></div>
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Taxa de Entrega (R$)</label><input type="number" id="cfg-taxa" step="0.01" class="w-full bg-slate-50 border p-3 rounded-xl mt-1 outline-none font-bold text-emerald-600"></div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-clock text-indigo-500"></i> Horários</h3>
                        <label class="flex items-center gap-2 cursor-pointer bg-red-50 text-red-600 px-3 py-1.5 rounded-lg border border-red-200"><input type="checkbox" id="cfg-manual" class="w-4 h-4 accent-red-600"><span class="text-xs font-bold uppercase">Fechar Loja Agora</span></label>
                    </div>
                    <div class="grid grid-cols-2 gap-4 max-w-md">
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Abre às:</label><input type="time" id="cfg-abre" class="w-full bg-slate-50 border p-3 rounded-xl mt-1 outline-none font-bold"></div>
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Fecha às:</label><input type="time" id="cfg-fecha" class="w-full bg-slate-50 border p-3 rounded-xl mt-1 outline-none font-bold"></div>
                    </div>
                </div>
            </section>

            <section id="aba-categorias" class="hidden">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4">Organize seu Cardápio (Ordem de Exibição)</h3>
                    <div class="flex gap-2 mb-6 max-w-md">
                        <input type="text" id="nova-cat" placeholder="Nova categoria..." class="flex-1 bg-slate-50 border p-3 rounded-xl outline-none">
                        <button onclick="addCategoria()" class="bg-slate-800 text-white px-6 rounded-xl font-bold">Adicionar</button>
                    </div>
                    <div id="lista-categorias" class="space-y-2 max-w-md">
                        </div>
                </div>
            </section>

            <section id="aba-produtos" class="hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Seus Produtos</h3>
                    <button onclick="abrirModalProduto()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-blue-700 transition"><i class="fa-solid fa-plus"></i> Novo Produto</button>
                </div>
                <div id="grid-produtos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </section>
        </main>
    </div>

    <div id="modal-produto" class="fixed inset-0 bg-slate-900/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl modal-enter flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-5 border-b">
                <h3 id="modal-titulo" class="text-lg font-bold">Editar Produto</h3>
                <button onclick="fecharModalProduto()" class="text-slate-400 hover:text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 space-y-5">
                <div class="bg-slate-50 p-3 rounded-xl border flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700"><i class="fa-solid fa-box-open text-blue-500 mr-2"></i>Disponibilidade em Estoque</span>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <span id="label-ativo" class="text-xs font-bold text-emerald-600 uppercase">Disponível</span>
                        <input type="checkbox" id="prod-ativo" class="w-6 h-6 accent-emerald-500" onchange="toggleLabelAtivo(this.checked)">
                    </label>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-2 space-y-4">
                        <div><label class="text-xs font-bold text-slate-500 uppercase">Nome</label><input type="text" id="prod-nome" class="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 outline-none"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs font-bold text-slate-500 uppercase">Preço (R$)</label><input type="number" step="0.01" id="prod-preco" class="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 outline-none text-emerald-600 font-bold"></div>
                            <div><label class="text-xs font-bold text-slate-500 uppercase">Categoria</label><select id="prod-cat" class="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 outline-none capitalize"></select></div>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase">Imagem</label>
                        <input type="text" id="prod-img" class="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 outline-none mb-2 text-xs">
                        <img id="prod-img-preview" src="" class="w-full h-24 object-cover rounded-xl border bg-slate-100">
                    </div>
                </div>

                <div><label class="text-xs font-bold text-slate-500 uppercase">Descrição</label><textarea id="prod-desc" class="w-full bg-slate-50 border p-2.5 rounded-xl mt-1 outline-none h-20 resize-none"></textarea></div>

                <div class="border-t pt-5">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs font-bold text-slate-800 uppercase flex items-center gap-2"><i class="fa-solid fa-puzzle-piece text-blue-500"></i> Adicionais</label>
                        <button onclick="adicionarLinhaAdicional()" class="text-xs bg-slate-100 font-bold px-3 py-1.5 rounded-lg">+ Novo</button>
                    </div>
                    <div id="lista-adicionais-modal" class="space-y-2"></div>
                </div>
            </div>

            <div class="p-5 border-t bg-slate-50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="fecharModalProduto()" class="px-5 py-2.5 text-slate-600 font-bold hover:bg-slate-200 rounded-xl">Cancelar</button>
                <button onclick="salvarProdutoModal()" class="bg-blue-600 text-white px-8 py-2.5 rounded-xl font-bold shadow hover:bg-blue-700">Salvar Produto</button>
            </div>
        </div>
    </div>

    <script>
        let DATA = { config: { categorias: [] }, items: [] };
        let SHA = ""; let produtoEditandoID = null; let adicionaisTemp = [];

        async function carregarDados() {
            const btn = document.getElementById('btn-login'); btn.innerHTML = 'Conectando...';
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, { headers: { 'Authorization': `token ${token}` }});
                if(!res.ok) throw new Error();
                const d = await res.json(); SHA = d.sha; DATA = JSON.parse(atob(d.content));
                
                document.getElementById('cfg-nome').value = DATA.config.nomeLoja || "";
                document.getElementById('cfg-logo').value = DATA.config.linkLogo || "";
                document.getElementById('cfg-cor').value = DATA.config.corPrincipal || "#ef4444";
                document.getElementById('cfg-zap').value = DATA.config.whatsapp || "";
                document.getElementById('cfg-taxa').value = DATA.config.taxaEntrega || 0;
                document.getElementById('cfg-abre').value = DATA.config.horaAbre || "18:00";
                document.getElementById('cfg-fecha').value = DATA.config.horaFecha || "23:59";
                document.getElementById('cfg-manual').checked = DATA.config.fechadoManual || false;
                
                document.getElementById('header-nome').innerText = document.getElementById('cfg-nome').value;
                document.getElementById('header-logo').src = document.getElementById('cfg-logo').value;
                renderCategorias(); renderProdutosGrid();
                document.getElementById('setup').classList.add('hidden'); document.getElementById('editor').classList.remove('hidden');
            } catch(e) { alert("Erro de conexão!"); btn.innerHTML = 'Conectar Sistema'; }
        }

        function mudarAba(idAba) {
            ['aba-loja', 'aba-categorias', 'aba-produtos'].forEach(a => document.getElementById(a).classList.add('hidden'));
            ['nav-loja', 'nav-categorias', 'nav-produtos'].forEach(n => document.getElementById(n).className = "pb-3 px-2 tab-inactive transition");
            document.getElementById(idAba).classList.remove('hidden');
            document.getElementById(idAba.replace('aba-', 'nav-')).className = "pb-3 px-2 tab-active transition";
        }

        // --- SISTEMA DE REORDENAÇÃO DE CATEGORIAS ---
        function renderCategorias() {
            const container = document.getElementById('lista-categorias');
            container.innerHTML = (DATA.config.categorias || []).map((cat, i) => `
                <div class="bg-white border shadow-sm px-4 py-3 rounded-xl flex items-center justify-between">
                    <span class="font-bold capitalize text-slate-700">${cat}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="moverCat(${i}, -1)" class="w-8 h-8 rounded bg-slate-50 hover:bg-slate-200 text-slate-500" title="Subir"><i class="fa-solid fa-arrow-up"></i></button>
                        <button onclick="moverCat(${i}, 1)" class="w-8 h-8 rounded bg-slate-50 hover:bg-slate-200 text-slate-500" title="Descer"><i class="fa-solid fa-arrow-down"></i></button>
                        <button onclick="removerCategoria(${i})" class="w-8 h-8 rounded bg-red-50 hover:bg-red-100 text-red-500 ml-2" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
            document.getElementById('prod-cat').innerHTML = (DATA.config.categorias || []).map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function moverCat(index, direcao) {
            const arr = DATA.config.categorias;
            if (direcao === -1 && index > 0) {
                [arr[index - 1], arr[index]] = [arr[index], arr[index - 1]];
            } else if (direcao === 1 && index < arr.length - 1) {
                [arr[index + 1], arr[index]] = [arr[index], arr[index + 1]];
            }
            renderCategorias();
        }

        function addCategoria() {
            const val = document.getElementById('nova-cat').value.trim().toLowerCase();
            if(val && !DATA.config.categorias.includes(val)) { DATA.config.categorias.push(val); document.getElementById('nova-cat').value = ""; renderCategorias(); }
        }
        function removerCategoria(i) { if(confirm("Excluir?")) { DATA.config.categorias.splice(i, 1); renderCategorias(); } }

        // --- SISTEMA DE PRODUTOS (COM PAUSA) ---
        function renderProdutosGrid() {
            document.getElementById('grid-produtos').innerHTML = DATA.items.map(p => {
                const isPausado = p.ativo === false;
                return `
                <div class="bg-white border rounded-2xl p-4 shadow-sm hover:shadow-md transition group relative ${isPausado ? 'opacity-70' : ''}">
                    <button onclick="excluirProduto(${p.id})" class="absolute top-2 right-2 bg-white/90 text-red-500 w-8 h-8 rounded-lg shadow opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash"></i></button>
                    ${isPausado ? `<div class="absolute -top-3 -left-3 bg-red-500 text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-md border-2 border-white">PAUSADO</div>` : ''}
                    <div class="flex gap-4 items-start">
                        <img src="${p.imagem}" class="w-20 h-20 object-cover rounded-xl border ${isPausado ? 'grayscale' : ''}">
                        <div>
                            <span class="text-[9px] font-bold text-slate-400 uppercase bg-slate-100 px-2 py-0.5 rounded-md mb-1 inline-block">${p.categoria}</span>
                            <h4 class="font-bold text-slate-800 leading-tight ${isPausado ? 'line-through decoration-red-500' : ''}">${p.nome}</h4>
                            <p class="text-emerald-600 font-bold mt-1">R$ ${p.preco.toFixed(2)}</p>
                        </div>
                    </div>
                    <button onclick="abrirModalProduto(${p.id})" class="w-full mt-4 bg-slate-50 text-slate-700 font-bold py-2 rounded-xl border hover:bg-slate-100 text-sm">Editar</button>
                </div>`
            }).join('');
        }

        function toggleLabelAtivo(isChecked) {
            const l = document.getElementById('label-ativo');
            if(isChecked) { l.innerText = "Disponível"; l.className = "text-xs font-bold text-emerald-600 uppercase"; }
            else { l.innerText = "Pausado (Em Falta)"; l.className = "text-xs font-bold text-red-600 uppercase"; }
        }

        function abrirModalProduto(id = null) {
            produtoEditandoID = id;
            if(id) {
                const p = DATA.items.find(i => i.id === id);
                document.getElementById('prod-nome').value = p.nome; document.getElementById('prod-preco').value = p.preco;
                document.getElementById('prod-desc').value = p.descricao || ""; document.getElementById('prod-img').value = p.imagem;
                document.getElementById('prod-img-preview').src = p.imagem; document.getElementById('prod-cat').value = p.categoria;
                const isAtivo = p.ativo !== false; // Padrão é true
                document.getElementById('prod-ativo').checked = isAtivo;
                toggleLabelAtivo(isAtivo);
                adicionaisTemp = JSON.parse(JSON.stringify(p.adicionais || []));
            } else {
                document.getElementById('prod-nome').value = ""; document.getElementById('prod-preco').value = "";
                document.getElementById('prod-desc').value = ""; document.getElementById('prod-img').value = "";
                document.getElementById('prod-img-preview').src = "https://via.placeholder.com/150";
                document.getElementById('prod-ativo').checked = true; toggleLabelAtivo(true);
                adicionaisTemp = [];
            }
            renderAdicionaisModal(); document.getElementById('modal-produto').classList.remove('hidden');
        }

        function fecharModalProduto() { document.getElementById('modal-produto').classList.add('hidden'); }
        document.getElementById('prod-img').addEventListener('input', e => document.getElementById('prod-img-preview').src = e.target.value || "https://via.placeholder.com/150");

        function renderAdicionaisModal() {
            document.getElementById('lista-adicionais-modal').innerHTML = adicionaisTemp.map((a, i) => `
                <div class="flex gap-2 items-center bg-slate-50 p-2 rounded-xl border">
                    <input type="text" value="${a.nome}" onchange="adicionaisTemp[${i}].nome=this.value" placeholder="Nome" class="flex-1 border p-2 rounded-lg text-sm outline-none">
                    <input type="number" step="0.01" value="${a.preco}" onchange="adicionaisTemp[${i}].preco=parseFloat(this.value)||0" placeholder="0.00" class="w-20 border p-2 rounded-lg text-sm font-bold text-emerald-600 outline-none">
                    <button onclick="adicionaisTemp.splice(${i},1); renderAdicionaisModal();" class="text-slate-300 hover:text-red-500 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>`).join('');
        }
        function adicionarLinhaAdicional() { adicionaisTemp.push({ nome: "", preco: 0 }); renderAdicionaisModal(); }

        function salvarProdutoModal() {
            const nome = document.getElementById('prod-nome').value.trim(); const cat = document.getElementById('prod-cat').value;
            if(!nome || !cat) return alert("Preencha o nome e categoria!");
            const dados = {
                id: produtoEditandoID || Date.now(), nome: nome, preco: parseFloat(document.getElementById('prod-preco').value) || 0,
                descricao: document.getElementById('prod-desc').value.trim(), imagem: document.getElementById('prod-img').value.trim() || "https://via.placeholder.com/150",
                categoria: cat, ativo: document.getElementById('prod-ativo').checked, adicionais: adicionaisTemp.filter(a => a.nome.trim() !== "")
            };
            if(produtoEditandoID) DATA.items[DATA.items.findIndex(i => i.id === produtoEditandoID)] = dados; else DATA.items.unshift(dados);
            renderProdutosGrid(); fecharModalProduto();
        }
        function excluirProduto(id) { if(confirm("Excluir produto?")) { DATA.items = DATA.items.filter(i => i.id !== id); renderProdutosGrid(); } }

        async function salvarNoGithub() {
            const btn = document.getElementById('btn-salvar'); btn.innerHTML = 'Publicando...'; btn.disabled = true;
            DATA.config.nomeLoja = document.getElementById('cfg-nome').value; DATA.config.linkLogo = document.getElementById('cfg-logo').value;
            DATA.config.corPrincipal = document.getElementById('cfg-cor').value; DATA.config.whatsapp = document.getElementById('cfg-zap').value;
            DATA.config.taxaEntrega = parseFloat(document.getElementById('cfg-taxa').value) || 0; DATA.config.horaAbre = document.getElementById('cfg-abre').value;
            DATA.config.horaFecha = document.getElementById('cfg-fecha').value; DATA.config.fechadoManual = document.getElementById('cfg-manual').checked;
            document.getElementById('header-nome').innerText = DATA.config.nomeLoja; document.getElementById('header-logo').src = DATA.config.linkLogo;
            const token = document.getElementById('gh-token').value; const repo = document.getElementById('gh-repo').value;
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                    method: 'PUT', headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update com reordenação e pausa", content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))), sha: SHA })
                });
                if(res.ok) { SHA = (await res.json()).content.sha; alert("✅ Sucesso!"); } else throw new Error();
            } catch(e) { alert("❌ Erro!"); }
            btn.innerHTML = 'Publicar Site'; btn.disabled = false;
        }
    </script>
</body>
</html>
