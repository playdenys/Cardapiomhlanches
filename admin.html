<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestor | Delivery Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f7fe; }</style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <aside class="w-full md:w-64 bg-white border-r p-6 flex flex-col gap-8">
        <h2 class="font-black italic uppercase text-slate-800">Admin Delivery</h2>
        <nav class="flex flex-col gap-2">
            <button onclick="showTab('dash')" class="p-4 rounded-2xl text-slate-500 font-bold text-sm text-left hover:bg-blue-50 hover:text-blue-600">Dashboard</button>
            <button onclick="showTab('cardapio')" class="p-4 rounded-2xl text-slate-500 font-bold text-sm text-left hover:bg-blue-50 hover:text-blue-600">Cardápio</button>
            <button onclick="showTab('config')" class="p-4 rounded-2xl text-slate-500 font-bold text-sm text-left hover:bg-blue-50 hover:text-blue-600">Configurações</button>
        </nav>
        <div class="mt-auto p-4 bg-slate-900 rounded-3xl text-white">
            <input type="password" id="gh-token" placeholder="GitHub Token" class="w-full bg-slate-800 p-2 rounded text-[10px] outline-none mb-2">
            <input type="text" id="gh-repo" placeholder="usuario/repo" class="w-full bg-slate-800 p-2 rounded text-[10px] outline-none mb-2">
            <button onclick="salvarAcesso()" class="w-full bg-blue-600 py-2 rounded text-[10px] font-black uppercase">Salvar Token</button>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <section id="tab-dash" class="tab-content">
            <h1 class="text-2xl font-black mb-8 uppercase italic">Visão Geral</h1>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border-l-4 border-blue-600">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Faturamento Mês</p>
                    <h2 id="venda-mes" class="text-3xl font-black">R$ 0,00</h2>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Pedidos Totais</p>
                    <h2 id="total-pedidos" class="text-3xl font-black">0</h2>
                </div>
            </div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm">
                <h3 class="font-black text-xs uppercase mb-6 italic">Fluxo de Vendas</h3>
                <canvas id="chartVendas"></canvas>
            </div>
        </section>

        <section id="tab-cardapio" class="tab-content hidden">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-black uppercase italic">Meus Itens</h1>
                <button onclick="salvarAlteracoes()" class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-black uppercase text-[10px]">Publicar no GitHub</button>
            </div>
            <div id="grid-produtos" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </section>

        <section id="tab-config" class="tab-content hidden">
             <h1 class="text-2xl font-black mb-8 uppercase italic">Configurar Loja</h1>
             <div class="bg-white p-8 rounded-[2.5rem] shadow-sm max-w-md space-y-4">
                 <input type="text" id="cfg-nome" placeholder="Nome da Loja" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold">
                 <input type="text" id="cfg-zap" placeholder="WhatsApp (Somente números)" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold">
                 <input type="number" id="cfg-taxa" placeholder="Taxa Entrega" class="w-full p-4 bg-slate-100 rounded-2xl outline-none font-bold">
                 <p class="text-[10px] font-black uppercase text-slate-400 px-2 mt-4">Status da Loja</p>
                 <select id="cfg-fechado" class="w-full p-4 bg-slate-100 rounded-2xl font-bold">
                     <option value="false">ABERTA</option>
                     <option value="true">FECHADA MANUALMENTE</option>
                 </select>
             </div>
        </section>
    </main>

    <script>
        let DATA = {}; let myChart = null;
        window.onload = () => {
            document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
            loadData();
        };

        async function loadData() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            renderCardapio();
            preencherConfig();
            renderStats();
        }

        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + t).classList.remove('hidden');
        }

        function renderCardapio() {
            document.getElementById('grid-produtos').innerHTML = DATA.items.map((p, i) => `
                <div class="bg-white rounded-[2rem] p-5 shadow-sm border">
                    <img src="${p.imagem}" class="w-full h-32 object-cover rounded-2xl mb-4">
                    <h4 class="font-black text-sm mb-1">${p.nome}</h4>
                    <p class="text-blue-600 font-bold text-xs mb-4">R$ ${p.preco.toFixed(2)}</p>
                    
                    <div class="space-y-3 pt-3 border-t">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-black text-slate-400 uppercase">Item Ativo</span>
                            <button onclick="toggleP(${i}, 'ativo')" class="w-10 h-5 rounded-full ${p.ativo ? 'bg-emerald-500' : 'bg-slate-200'} relative">
                                <div class="absolute w-3 h-3 bg-white rounded-full top-1 left-1 transition-all ${p.ativo ? 'translate-x-5' : ''}"></div>
                            </button>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-black text-slate-400 uppercase">Permitir Obs?</span>
                            <button onclick="toggleP(${i}, 'permiteObs')" class="w-10 h-5 rounded-full ${p.permiteObs !== false ? 'bg-blue-600' : 'bg-slate-200'} relative">
                                <div class="absolute w-3 h-3 bg-white rounded-full top-1 left-1 transition-all ${p.permiteObs !== false ? 'translate-x-5' : ''}"></div>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleP(idx, campo) {
            if(campo === 'permiteObs') DATA.items[idx].permiteObs = DATA.items[idx].permiteObs === false ? true : false;
            else DATA.items[idx][campo] = !DATA.items[idx][campo];
            renderCardapio();
        }

        function preencherConfig() {
            document.getElementById('cfg-nome').value = DATA.config.nomeLoja;
            document.getElementById('cfg-zap').value = DATA.config.whatsapp;
            document.getElementById('cfg-taxa').value = DATA.config.taxaEntrega;
            document.getElementById('cfg-fechado').value = DATA.config.fechadoManual.toString();
        }

        function renderStats() {
            const vendas = DATA.vendas || [];
            const total = vendas.reduce((a,b) => a + b.valor, 0);
            document.getElementById('venda-mes').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('total-pedidos').innerText = vendas.length;

            const ctx = document.getElementById('chartVendas').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: vendas.slice(-7).map(v => v.data),
                    datasets: [{ data: vendas.slice(-7).map(v => v.valor), borderColor: '#2563eb', tension: 0.4, fill: true, backgroundColor: 'rgba(37,99,235,0.1)' }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        function salvarAcesso() {
            localStorage.setItem('gh_token', document.getElementById('gh-token').value);
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value);
            alert("Acesso salvo!");
        }

        async function salvarAlteracoes() {
            DATA.config.nomeLoja = document.getElementById('cfg-nome').value;
            DATA.config.whatsapp = document.getElementById('cfg-zap').value;
            DATA.config.taxaEntrega = parseFloat(document.getElementById('cfg-taxa').value);
            DATA.config.fechadoManual = document.getElementById('cfg-fechado').value === "true";

            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            const url = `https://api.github.com/repos/${repo}/contents/produtos.json`;
            const get = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            const j = await get.json();

            await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Update", content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))), sha: j.sha })
            });
            alert("Salvo no GitHub!");
        }
    </script>
</body>
</html>
