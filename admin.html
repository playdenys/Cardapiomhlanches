<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin Automático</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <div id="setup" class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
            <h2 class="font-bold mb-4">Conectar ao GitHub</h2>
            <input type="password" id="gh-token" placeholder="Seu GitHub Token" class="w-full border p-2 mb-2 rounded">
            <input type="text" id="gh-repo" placeholder="usuario/nome-do-repositorio" class="w-full border p-2 mb-2 rounded">
            <button onclick="carregarDadosAtuais()" class="w-full bg-slate-800 text-white py-2 rounded font-bold">Conectar e Abrir Painel</button>
        </div>

        <div id="editor" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="font-bold text-lg mb-4">Configurações Visuais</h2>
                <input type="text" id="cfg-nome" placeholder="Nome da Loja" class="w-full border p-2 mb-2 rounded">
                <input type="color" id="cfg-cor" class="w-full h-10 border p-1 rounded mb-2">
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="font-bold text-lg mb-4">Produtos</h2>
                <div id="lista-produtos" class="space-y-2 mb-4"></div>
                <button onclick="novoProduto()" class="w-full border-2 border-dashed border-slate-300 py-3 rounded-lg text-slate-500 hover:bg-slate-50">+ Novo Produto</button>
            </div>

            <button onclick="salvarNoGithub()" id="btn-salvar" class="fixed bottom-6 right-6 bg-green-600 text-white px-8 py-4 rounded-full font-bold shadow-2xl hover:scale-105 transition-all">
                <i class="fa-solid fa-cloud-arrow-up"></i> PUBLICAR NO SITE
            </button>
        </div>
    </div>

    <script>
        let dadosAtuais = { config: {}, items: [] };
        let shaArquivo = ""; // Necessário para o GitHub saber qual versão estamos editando

        async function carregarDadosAtuais() {
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                shaArquivo = data.sha;
                dadosAtuais = JSON.parse(atob(data.content)); // Decodifica o conteúdo do GitHub

                // Preencher campos
                document.getElementById('cfg-nome').value = dadosAtuais.config.nomeLoja;
                document.getElementById('cfg-cor').value = dadosAtuais.config.corPrincipal;
                
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('editor').classList.remove('hidden');
                renderizarProdutos();
            } catch (e) { alert("Erro ao conectar! Verifique o Token e o Nome do Repositório."); }
        }

        function renderizarProdutos() {
            const lista = document.getElementById('lista-produtos');
            lista.innerHTML = dadosAtuais.items.map((p, index) => `
                <div class="flex gap-2 bg-slate-50 p-2 rounded border">
                    <input type="text" value="${p.nome}" onchange="atualizarItem(${index}, 'nome', this.value)" class="flex-1 p-1 border rounded">
                    <input type="number" value="${p.preco}" onchange="atualizarItem(${index}, 'preco', this.value)" class="w-20 p-1 border rounded">
                    <button onclick="remover(${index})" class="text-red-500 px-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function atualizarItem(index, campo, valor) {
            dadosAtuais.items[index][campo] = campo === 'preco' ? parseFloat(valor) : valor;
        }

        function novoProduto() {
            dadosAtuais.items.push({ nome: "Novo Lanche", preco: 0, categoria: "lanches", imagem: "" });
            renderizarProdutos();
        }

        async function salvarNoGithub() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "Salvando...";
            btn.disabled = true;

            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            
            // Atualiza config antes de enviar
            dadosAtuais.config.nomeLoja = document.getElementById('cfg-nome').value;
            dadosAtuais.config.corPrincipal = document.getElementById('cfg-cor').value;

            const novoConteudo = btoa(unescape(encodeURIComponent(JSON.stringify(dadosAtuais, null, 2))));

            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Atualização via Painel Admin",
                        content: novoConteudo,
                        sha: shaArquivo
                    })
                });

                if(res.ok) {
                    const resData = await res.json();
                    shaArquivo = resData.content.sha; // Atualiza o SHA para a próxima edição
                    alert("✅ SITE ATUALIZADO COM SUCESSO!");
                }
            } catch (e) { alert("Erro ao salvar!"); }
            
            btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> PUBLICAR NO SITE';
            btn.disabled = false;
        }
    </script>
</body>
</html>
