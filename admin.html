<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Delivery Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; }
        .card-dash { background: white; border-radius: 2rem; padding: 1.5rem; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h1 class="text-3xl font-black italic text-slate-800 uppercase tracking-tighter">Dashboard <span class="text-blue-600">Admin</span></h1>
                <p class="text-slate-500 text-sm font-medium">Gerencie suas vendas e cardápio em tempo real.</p>
            </div>
            
            <div class="flex flex-wrap gap-2 bg-white p-2 rounded-[2rem] border shadow-sm w-full md:w-auto">
                <input type="password" id="gh-token" placeholder="GitHub Token" class="bg-slate-50 px-4 py-2 rounded-xl text-xs outline-none focus:ring-2 ring-blue-500">
                <input type="text" id="gh-repo" placeholder="usuario/repositorio" class="bg-slate-50 px-4 py-2 rounded-xl text-xs outline-none focus:ring-2 ring-blue-500">
                <button onclick="salvarConfig()" class="bg-slate-900 text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-blue-600 transition-all">Salvar Acesso</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="card-dash border-l-8 border-blue-600 shadow-xl shadow-blue-50">
                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Vendas Hoje</p>
                <h2 id="venda-hoje" class="text-3xl font-black text-slate-800 italic">R$ 0,00</h2>
            </div>
            <div class="card-dash border-l-8 border-emerald-500 shadow-xl shadow-emerald-50">
                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Vendas no Mês</p>
                <h2 id="venda-mes" class="text-3xl font-black text-slate-800 italic">R$ 0,00</h2>
            </div>
            <div class="card-dash border-l-8 border-purple-500 shadow-xl shadow-purple-50">
                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Total Pedidos</p>
                <h2 id="total-pedidos" class="text-3xl font-black text-slate-800 italic">0</h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-10">
            <div class="card-dash shadow-sm">
                <h3 class="font-black text-slate-800 mb-6 uppercase text-xs italic tracking-widest"><i class="fa-solid fa-chart-line mr-2"></i> Evolução Diária</h3>
                <canvas id="chartVendas" height="200"></canvas>
            </div>
            <div class="card-dash shadow-sm">
                <h3 class="font-black text-slate-800 mb-6 uppercase text-xs italic tracking-widest"><i class="fa-solid fa-trophy mr-2"></i> Produtos Mais Vendidos</h3>
                <div id="ranking-produtos" class="space-y-4">
                    </div>
            </div>
        </div>

        <div class="card-dash shadow-sm">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-slate-800 uppercase text-xs italic tracking-widest">Gestão do Cardápio</h3>
                <button onclick="salvarAlteracoes()" class="bg-emerald-600 text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-emerald-100 hover:scale-105 transition-all">Salvar Mudanças no GitHub</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] uppercase text-slate-400 border-b">
                            <th class="pb-4">Produto</th>
                            <th class="pb-4">Preço (R$)</th>
                            <th class="pb-4">Categoria</th>
                            <th class="pb-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="lista-edit" class="text-sm font-medium">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let DATA = {};
        let myChart = null;

        // Ao carregar, recupera Token e Repo do LocalStorage (Praticidade!)
        window.onload = () => {
            document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
            loadData();
        };

        function salvarConfig() {
            localStorage.setItem('gh_token', document.getElementById('gh-token').value);
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value);
            alert("Configurações de acesso salvas no seu navegador!");
            location.reload();
        }

        async function loadData() {
            const res = await fetch('produtos.json', { cache: 'no-store' });
            DATA = await res.json();
            processarEstatisticas();
            renderListaProdutos();
        }

        function processarEstatisticas() {
            const vendas = DATA.vendas || [];
            const hoje = new Date().toLocaleDateString('pt-BR');
            const mesAtual = new Date().getMonth();

            let totalHoje = 0;
            let totalMes = 0;
            let contagemProdutos = {};

            vendas.forEach(v => {
                const [d, m, y] = v.data.split('/');
                const dataVenda = new Date(y, m - 1, d);

                // Soma Hoje
                if(v.data === hoje) totalHoje += v.valor;
                
                // Soma Mês
                if(dataVenda.getMonth() === mesAtual) totalMes += v.valor;

                // Ranking de Produtos
                v.itens.forEach(item => {
                    contagemProdutos[item] = (contagemProdutos[item] || 0) + 1;
                });
            });

            document.getElementById('venda-hoje').innerText = `R$ ${totalHoje.toFixed(2)}`;
            document.getElementById('venda-mes').innerText = `R$ ${totalMes.toFixed(2)}`;
            document.getElementById('total-pedidos').innerText = vendas.length;

            renderRanking(contagemProdutos);
            renderGrafico(vendas);
        }

        function renderRanking(contagem) {
            const sortable = Object.entries(contagem).sort(([,a],[,b]) => b-a).slice(0, 5);
            const container = document.getElementById('ranking-produtos');
            container.innerHTML = sortable.map(([nome, qtd], i) => `
                <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 flex items-center justify-center bg-blue-600 text-white text-[10px] font-bold rounded-full">${i+1}</span>
                        <span class="text-xs font-bold text-slate-700">${nome}</span>
                    </div>
                    <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full">${qtd} vendidos</span>
                </div>
            `).join('');
        }

        function renderGrafico(vendas) {
            const ultimos7Dias = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - i);
                return d.toLocaleDateString('pt-BR');
            }).reverse();

            const valores = ultimos7Dias.map(dia => {
                return vendas.filter(v => v.data === dia).reduce((acc, curr) => acc + curr.valor, 0);
            });

            const ctx = document.getElementById('chartVendas').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ultimos7Dias.map(d => d.split('/')[0] + '/' + d.split('/')[1]),
                    datasets: [{
                        label: 'Vendas (R$)',
                        data: valores,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4,
                        pointRadius: 0
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderListaProdutos() {
            const tbody = document.getElementById('lista-edit');
            tbody.innerHTML = DATA.items.map((p, i) => `
                <tr class="border-b last:border-0">
                    <td class="py-4 flex items-center gap-3">
                        <img src="${p.imagem}" class="w-10 h-10 rounded-xl object-cover shadow-sm">
                        <input type="text" value="${p.nome}" onchange="updateItem(${i}, 'nome', this.value)" class="bg-transparent border-b border-transparent focus:border-blue-600 outline-none">
                    </td>
                    <td class="py-4">
                        <input type="number" step="0.01" value="${p.preco}" onchange="updateItem(${i}, 'preco', parseFloat(this.value))" class="w-20 bg-transparent border-b border-transparent focus:border-blue-600 outline-none font-bold text-emerald-600">
                    </td>
                    <td class="py-4">
                        <span class="text-[10px] uppercase font-black text-slate-400 bg-slate-100 px-3 py-1 rounded-full">${p.categoria}</span>
                    </td>
                    <td class="py-4">
                        <button onclick="toggleItem(${i})" class="w-12 h-6 rounded-full relative transition-all ${p.ativo ? 'bg-emerald-500' : 'bg-slate-300'}">
                            <div class="absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-all ${p.ativo ? 'translate-x-6' : ''}"></div>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateItem(idx, campo, valor) { DATA.items[idx][campo] = valor; }
        function toggleItem(idx) { DATA.items[idx].ativo = !DATA.items[idx].ativo; renderListaProdutos(); }

        async function salvarAlteracoes() {
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            if(!token || !repo) return alert("Preencha o Token e o Repositório!");

            const url = `https://api.github.com/repos/${repo}/contents/produtos.json`;
            
            try {
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                const getData = await getRes.json();
                const sha = getData.sha;

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Update cardápio via Admin",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))),
                        sha: sha
                    })
                });

                if(putRes.ok) alert("✅ Cardápio atualizado no GitHub com sucesso!");
                else alert("❌ Erro ao salvar. Verifique o token e permissões.");
            } catch (e) { alert("Erro de conexão!"); }
        }
    </script>
</body>
</html>
