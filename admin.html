<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestão Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 pb-20">
    <div id="setup" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full">
            <h1 class="text-2xl font-bold mb-6 text-center">Acesso Admin</h1>
            <input type="password" id="gh-token" placeholder="GitHub Token" class="w-full border p-3 rounded-xl mb-3 outline-none">
            <input type="text" id="gh-repo" placeholder="usuario/repositorio" class="w-full border p-3 rounded-xl mb-6 outline-none">
            <button onclick="carregarDados()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">Entrar</button>
        </div>
    </div>

    <div id="editor" class="hidden max-w-5xl mx-auto p-4 space-y-6">
        <header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border sticky top-0 z-50">
            <h2 class="font-bold text-xl italic text-red-500">Admin Pro</h2>
            <button onclick="salvar()" id="btn-salvar" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold italic">Publicar Alterações</button>
        </header>

        <section class="bg-white p-6 rounded-2xl border shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
            <h3 class="col-span-full font-bold border-b pb-2">Configurações Gerais</h3>
            <div><label class="text-[10px] font-bold text-slate-400">NOME DA LOJA</label><input type="text" id="cfg-nome" class="w-full border p-2 rounded-lg"></div>
            <div><label class="text-[10px] font-bold text-slate-400">WHATSAPP</label><input type="text" id="cfg-zap" class="w-full border p-2 rounded-lg"></div>
            <div><label class="text-[10px] font-bold text-slate-400">TAXA ENTREGA (R$)</label><input type="number" id="cfg-taxa" step="0.01" class="w-full border p-2 rounded-lg"></div>
            <div class="flex gap-2">
                <div class="flex-1"><label class="text-[10px] font-bold text-slate-400">ABRE</label><input type="time" id="cfg-abre" class="w-full border p-2 rounded-lg"></div>
                <div class="flex-1"><label class="text-[10px] font-bold text-slate-400">FECHA</label><input type="time" id="cfg-fecha" class="w-full border p-2 rounded-lg"></div>
            </div>
            <div class="flex items-center gap-4 bg-red-50 p-3 rounded-xl">
                <input type="checkbox" id="cfg-manual" class="w-5 h-5 accent-red-600">
                <label class="font-bold text-red-600 text-xs">FECHAR LOJA AGORA (EMERGÊNCIA)</label>
            </div>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Produtos</h3><button onclick="novoItem()" class="bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Novo</button></div>
            <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </div>

    <script>
        let DATA = {}; let SHA = "";
        async function carregarDados() {
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, { headers: { 'Authorization': `token ${token}` }});
                const d = await res.json(); SHA = d.sha; DATA = JSON.parse(atob(d.content));
                document.getElementById('cfg-nome').value = DATA.config.nomeLoja;
                document.getElementById('cfg-zap').value = DATA.config.whatsapp;
                document.getElementById('cfg-taxa').value = DATA.config.taxaEntrega;
                document.getElementById('cfg-abre').value = DATA.config.horaAbre;
                document.getElementById('cfg-fecha').value = DATA.config.horaFecha;
                document.getElementById('cfg-manual').checked = DATA.config.fechadoManual;
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('editor').classList.remove('hidden');
                render();
            } catch(e) { alert("Erro ao carregar!"); }
        }

        function render() {
            const cont = document.getElementById('lista-produtos');
            cont.innerHTML = DATA.items.map((p, i) => `
                <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3 relative">
                    <button onclick="remover(${i})" class="absolute top-2 right-2 text-red-300 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                    <div class="flex gap-4">
                        <img src="${p.imagem}" class="w-16 h-16 rounded-xl object-cover border">
                        <div class="flex-1 space-y-2">
                            <input type="text" onchange="edit(${i},'nome',this.value)" value="${p.nome}" class="w-full font-bold text-sm border-b outline-none">
                            <input type="number" step="0.01" onchange="edit(${i},'preco',this.value)" value="${p.preco}" class="w-24 text-emerald-600 font-bold border rounded p-1 text-xs">
                        </div>
                    </div>
                    <div>
                        <label class="text-[9px] font-bold text-slate-400">ADICIONAIS (NOME:VALOR, NOME:VALOR)</label>
                        <textarea onchange="editAdicionais(${i}, this.value)" class="w-full border p-2 rounded-lg text-[10px] h-12 outline-none">${(p.adicionais || []).map(a => `${a.nome}:${a.preco.toFixed(2)}`).join(', ')}</textarea>
                    </div>
                </div>`).join('');
        }

        function edit(i, c, v) { DATA.items[i][c] = c === 'preco' ? parseFloat(v) : v; }
        function remover(i) { if(confirm("Remover?")) { DATA.items.splice(i,1); render(); } }
        function editAdicionais(i, v) {
            if(!v.trim()) { DATA.items[i].adicionais = []; return; }
            DATA.items[i].adicionais = v.split(',').map(p => {
                const [n, val] = p.split(':');
                return { nome: n.trim(), preco: parseFloat(val) || 0 };
            });
        }
        function novoItem() { DATA.items.unshift({ id: Date.now(), nome: "Novo", preco: 0, imagem: "https://via.placeholder.com/150", categoria: DATA.config.categorias[0], adicionais: [] }); render(); }
        async function salvar() {
            const btn = document.getElementById('btn-salvar'); btn.innerHTML = "Salvando...";
            DATA.config.nomeLoja = document.getElementById('cfg-nome').value;
            DATA.config.whatsapp = document.getElementById('cfg-zap').value;
            DATA.config.taxaEntrega = parseFloat(document.getElementById('cfg-taxa').value);
            DATA.config.horaAbre = document.getElementById('cfg-abre').value;
            DATA.config.horaFecha = document.getElementById('cfg-fecha').value;
            DATA.config.fechadoManual = document.getElementById('cfg-manual').checked;
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                method: 'PUT', headers: { 'Authorization': `token ${token}` },
                body: JSON.stringify({ message: "Update", content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))), sha: SHA })
            });
            if(res.ok) alert("Sucesso!"); else alert("Erro!");
            btn.innerHTML = "Publicar Alterações";
        }
    </script>
</body>
</html>
