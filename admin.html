<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gestor | Autônomo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 flex h-screen text-slate-800">

    <aside class="w-64 bg-slate-900 text-white p-6 flex flex-col hidden md:flex">
        <h2 class="font-bold text-xl mb-8 border-b border-slate-700 pb-4">Painel Delivery</h2>
        <nav class="flex-1 space-y-2">
            <button onclick="showTab('dash')" class="w-full text-left p-3 rounded hover:bg-slate-800"><i class="fa-solid fa-chart-pie w-6"></i> Dashboard</button>
            <button onclick="showTab('produtos')" class="w-full text-left p-3 rounded hover:bg-slate-800"><i class="fa-solid fa-burger w-6"></i> Produtos</button>
            <button onclick="showTab('config')" class="w-full text-left p-3 rounded hover:bg-slate-800"><i class="fa-solid fa-gear w-6"></i> Loja & Horários</button>
            <button onclick="showTab('github')" class="w-full text-left p-3 rounded hover:bg-slate-800"><i class="fa-brands fa-github w-6"></i> Sincronização</button>
        </nav>
        <button onclick="salvarNoGitHub()" class="mt-auto bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition-colors">Salvar Alterações</button>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto">
        
        <section id="tab-dash" class="tab-content space-y-6">
            <h2 class="text-xl font-bold">Visão Geral</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-6 rounded-lg shadow-sm border border-l-4 border-l-blue-500">
                    <p class="text-xs font-bold text-gray-500 uppercase">Produtos Ativos</p>
                    <h3 class="text-3xl font-black mt-2" id="dash-produtos">0</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border border-l-4 border-l-orange-500">
                    <p class="text-xs font-bold text-gray-500 uppercase">Status da Loja</p>
                    <h3 class="text-xl font-black mt-2" id="dash-status">Verificando...</h3>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border border-l-4 border-l-green-500">
                    <p class="text-xs font-bold text-gray-500 uppercase">Faturamento (Exemplo)</p>
                    <h3 class="text-3xl font-black mt-2 text-green-600">R$ 0,00</h3>
                </div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border mt-6">
                <h3 class="text-sm font-bold text-gray-500 uppercase mb-4">Acessos à Loja na Semana</h3>
                <canvas id="chartGrafico" height="80"></canvas>
            </div>
        </section>

        <section id="tab-produtos" class="tab-content hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border">
                <h2 class="text-xl font-bold">Gestão de Estoque</h2>
                <button onclick="abrirModalProd()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">+ Novo Produto</button>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-sm border">
                <h3 class="font-bold text-sm text-gray-500 mb-4 uppercase">Categorias (Organização)</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="nova-cat" placeholder="Nova categoria..." class="border p-2 rounded text-sm flex-1">
                    <button onclick="addCat()" class="bg-slate-800 text-white px-4 rounded text-sm">Adicionar</button>
                </div>
                <div id="lista-cats" class="flex flex-wrap gap-2 mb-6"></div>
                <hr class="mb-6">
                <div id="grid-produtos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <section id="tab-config" class="tab-content hidden space-y-6">
            <h2 class="text-xl font-bold">Configurações da Loja</h2>
            <div class="bg-white p-6 rounded-lg shadow-sm border grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <div><label class="text-xs font-bold text-gray-500">Nome da Loja</label><input type="text" id="cfg-nome" class="w-full border p-2 rounded mt-1"></div>
                    <div><label class="text-xs font-bold text-gray-500">WhatsApp (55DDD9...)</label><input type="text" id="cfg-zap" class="w-full border p-2 rounded mt-1"></div>
                    <div><label class="text-xs font-bold text-gray-500">Taxa de Entrega (R$)</label><input type="number" id="cfg-taxa" class="w-full border p-2 rounded mt-1"></div>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-500 mb-2">Horários de Funcionamento</h3>
                    <div id="lista-horarios" class="space-y-2"></div>
                </div>
                <button onclick="salvarConfigLocal()" class="md:col-span-2 bg-slate-800 text-white py-3 rounded font-bold">Aplicar Configurações</button>
            </div>
        </section>

        <section id="tab-github" class="tab-content hidden space-y-6">
            <h2 class="text-xl font-bold">Conexão Segura GitHub</h2>
            <div class="bg-white p-6 rounded-lg shadow-sm border max-w-md">
                <div class="space-y-4">
                    <div><label class="text-xs font-bold text-gray-500">Token de Acesso</label><input type="password" id="gh-token" class="w-full border p-2 rounded mt-1 text-sm"></div>
                    <div><label class="text-xs font-bold text-gray-500">Repositório (usuario/repo)</label><input type="text" id="gh-repo" class="w-full border p-2 rounded mt-1 text-sm"></div>
                    <button onclick="salvarCredenciais()" class="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">Salvar Credenciais no Navegador</button>
                </div>
            </div>
        </section>
    </main>

    <div id="modal-edit" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg w-full max-w-md">
            <h3 class="font-bold text-lg mb-4" id="mdl-title">Produto</h3>
            <div class="space-y-3">
                <input type="hidden" id="p-id">
                <div><label class="text-xs font-bold text-gray-500">Nome</label><input type="text" id="p-nome" class="w-full border p-2 rounded text-sm"></div>
                <div><label class="text-xs font-bold text-gray-500">Preço (R$)</label><input type="number" step="0.01" id="p-preco" class="w-full border p-2 rounded text-sm"></div>
                <div><label class="text-xs font-bold text-gray-500">Categoria</label><select id="p-cat" class="w-full border p-2 rounded text-sm"></select></div>
                <div><label class="text-xs font-bold text-gray-500">Descrição</label><textarea id="p-desc" class="w-full border p-2 rounded text-sm"></textarea></div>
                <div><label class="text-xs font-bold text-gray-500">Link da Foto (URL)</label><input type="text" id="p-img" class="w-full border p-2 rounded text-sm"></div>
                <div class="flex items-center gap-2 mt-2"><input type="checkbox" id="p-ativo"><label class="text-sm font-bold">Produto Ativo (Visível)</label></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="document.getElementById('modal-edit').classList.add('hidden')" class="px-4 py-2 bg-gray-200 rounded font-bold text-sm">Cancelar</button>
                <button onclick="salvarProduto()" class="px-4 py-2 bg-blue-600 text-white rounded font-bold text-sm">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let DATA = { config: { categorias: [], horarios: {} }, items: [] };
        const dias = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
        let meuGrafico = null;

        window.onload = async () => {
            document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
            document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
            try {
                const res = await fetch('produtos.json', { cache: 'no-store' });
                DATA = await res.json();
                renderAll();
            } catch(e) { alert("Não foi possível carregar o JSON. Verifique se o arquivo existe e é válido."); }
        };

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            if (id === 'dash') renderDashboard();
        }

        function renderAll() { 
            renderCats(); 
            renderProdutos(); 
            preencherConfig(); 
            renderDashboard(); // Carrega o dashboard na inicialização
        }

        // --- DASHBOARD ---
        function renderDashboard() {
            // Contagem de produtos ativos com fallback caso dê erro
            const totalAtivos = (DATA.items || []).filter(p => p.ativo).length;
            document.getElementById('dash-produtos').innerText = totalAtivos;

            // Verificar status da loja (baseado no horário atual do PC)
            const agora = new Date();
            const dia = agora.getDay();
            const horaAtual = agora.getHours().toString().padStart(2,'0') + ":" + agora.getMinutes().toString().padStart(2,'0');
            
            const h = DATA.config?.horarios?.[dia];
            let aberta = false;
            
            if (h && h.aberto && horaAtual >= h.inicio && horaAtual <= h.fim) {
                aberta = true;
            }

            const elStatus = document.getElementById('dash-status');
            if (aberta) {
                elStatus.innerText = "ABERTA";
                elStatus.className = "text-xl font-black mt-2 text-green-500";
            } else {
                elStatus.innerText = "FECHADA";
                elStatus.className = "text-xl font-black mt-2 text-orange-500";
            }

            // Gráfico de Exemplo
            const ctx = document.getElementById('chartGrafico').getContext('2d');
            if(meuGrafico) meuGrafico.destroy();
            meuGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
                    datasets: [{ 
                        label: 'Acessos/Visitas', 
                        data: [12, 19, 15, 25, 40, 50, 30], 
                        backgroundColor: '#3b82f6',
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        // --- CATEGORIAS ---
        function renderCats() {
            const selectCat = document.getElementById('p-cat'); selectCat.innerHTML = '';
            document.getElementById('lista-cats').innerHTML = (DATA.config.categorias || []).map((c, i) => {
                selectCat.innerHTML += `<option value="${c}">${c}</option>`;
                return `<span class="bg-gray-200 text-sm px-3 py-1 rounded flex items-center gap-2">${c} <i onclick="delCat(${i})" class="fa-solid fa-xmark text-red-500 cursor-pointer"></i></span>`;
            }).join('');
        }
        function addCat() { const v = document.getElementById('nova-cat').value; if(v){ DATA.config.categorias.push(v); document.getElementById('nova-cat').value = ''; renderCats(); } }
        function delCat(i) { DATA.config.categorias.splice(i, 1); renderCats(); }

        // --- PRODUTOS ---
        function renderProdutos() {
            document.getElementById('grid-produtos').innerHTML = DATA.items.map(p => `
                <div class="border p-4 rounded-lg flex items-center gap-4 ${p.ativo ? 'bg-white' : 'bg-gray-50 opacity-60'}">
                    <img src="${p.imagem}" class="w-16 h-16 object-cover rounded bg-gray-200">
                    <div class="flex-1">
                        <p class="font-bold text-sm">${p.nome}</p>
                        <p class="text-green-600 text-xs font-bold">R$ ${p.preco.toFixed(2)}</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="editarProd(${p.id})" class="text-blue-500 hover:text-blue-700"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="excluirProd(${p.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }
        
        function abrirModalProd() { document.getElementById('p-id').value = ''; document.getElementById('p-nome').value = ''; document.getElementById('p-preco').value = ''; document.getElementById('p-desc').value = ''; document.getElementById('p-img').value = ''; document.getElementById('p-ativo').checked = true; document.getElementById('modal-edit').classList.remove('hidden'); }
        function editarProd(id) { const p = DATA.items.find(x => x.id === id); document.getElementById('p-id').value = p.id; document.getElementById('p-nome').value = p.nome; document.getElementById('p-preco').value = p.preco; document.getElementById('p-desc').value = p.descricao; document.getElementById('p-img').value = p.imagem; document.getElementById('p-cat').value = p.categoria; document.getElementById('p-ativo').checked = p.ativo; document.getElementById('modal-edit').classList.remove('hidden'); }
        function excluirProd(id) { if(confirm("Excluir produto?")) { DATA.items = DATA.items.filter(x => x.id !== id); renderProdutos(); } }
        
        function salvarProduto() {
            const id = document.getElementById('p-id').value;
            const prod = {
                id: id ? parseInt(id) : Date.now(), nome: document.getElementById('p-nome').value, preco: parseFloat(document.getElementById('p-preco').value), descricao: document.getElementById('p-desc').value, imagem: document.getElementById('p-img').value, categoria: document.getElementById('p-cat').value, ativo: document.getElementById('p-ativo').checked
            };
            if(id) { const idx = DATA.items.findIndex(x => x.id === parseInt(id)); DATA.items[idx] = prod; } else { DATA.items.push(prod); }
            document.getElementById('modal-edit').classList.add('hidden'); renderProdutos(); renderDashboard();
        }

        // --- CONFIGURAÇÕES & HORÁRIOS ---
        function preencherConfig() {
            document.getElementById('cfg-nome').value = DATA.config.nomeLoja || '';
            document.getElementById('cfg-zap').value = DATA.config.whatsapp || '';
            document.getElementById('cfg-taxa').value = DATA.config.taxaEntrega || 0;
            
            if(!DATA.config.horarios) DATA.config.horarios = {};
            document.getElementById('lista-horarios').innerHTML = dias.map((d, i) => {
                const h = DATA.config.horarios[i] || { aberto: false, inicio: "00:00", fim: "00:00" };
                return `
                <div class="flex items-center gap-2 bg-gray-50 p-2 rounded text-sm">
                    <span class="w-20 font-bold">${d}</span>
                    <input type="checkbox" id="h-aberto-${i}" ${h.aberto ? 'checked' : ''}> <label>Abre?</label>
                    <input type="time" id="h-ini-${i}" value="${h.inicio}" class="border rounded px-1 ml-2"> às 
                    <input type="time" id="h-fim-${i}" value="${h.fim}" class="border rounded px-1">
                </div>`;
            }).join('');
        }

        function salvarConfigLocal() {
            DATA.config.nomeLoja = document.getElementById('cfg-nome').value;
            DATA.config.whatsapp = document.getElementById('cfg-zap').value;
            DATA.config.taxaEntrega = parseFloat(document.getElementById('cfg-taxa').value);
            for(let i=0; i<7; i++) {
                DATA.config.horarios[i] = { aberto: document.getElementById(`h-aberto-${i}`).checked, inicio: document.getElementById(`h-ini-${i}`).value, fim: document.getElementById(`h-fim-${i}`).value };
            }
            alert("Aplicado! Lembre-se de clicar em 'Salvar Alterações' no menu para enviar ao GitHub.");
            renderDashboard(); // Atualiza o status da loja se o horário foi modificado
        }

        // --- GITHUB SYNC ---
        function salvarCredenciais() { localStorage.setItem('gh_token', document.getElementById('gh-token').value); localStorage.setItem('gh_repo', document.getElementById('gh-repo').value); alert("Salvo no navegador!"); }

        async function salvarNoGitHub() {
            const token = localStorage.getItem('gh_token'); const repo = localStorage.getItem('gh_repo');
            if(!token || !repo) return alert("Vá na aba Sincronização e preencha Token e Repositório primeiro.");
            try {
                const url = `https://api.github.com/repos/${repo}/contents/produtos.json`;
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` }, cache: 'no-store' });
                const getJson = await getRes.json();
                
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update Admin - " + new Date().toLocaleString(), content: btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2)))), sha: getJson.sha })
                });
                if(putRes.ok) alert("✅ Sucesso! Cardápio atualizado na internet."); else alert("❌ Erro ao salvar. Verifique o Token.");
            } catch (e) { alert("Erro de conexão com o GitHub."); }
        }
    </script>
</body>
</html>
