<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Delivery Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 pb-20">

    <div id="setup" class="fixed inset-0 bg-slate-900 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
            <h1 class="text-2xl font-bold mb-6 text-slate-800">Painel de Controle</h1>
            <input type="password" id="gh-token" placeholder="GitHub Token" class="w-full border-2 p-3 rounded-xl mb-3 outline-none">
            <input type="text" id="gh-repo" placeholder="usuario/repositorio" class="w-full border-2 p-3 rounded-xl mb-6 outline-none">
            <button onclick="carregarDadosAtuais()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg">Acessar Painel</button>
        </div>
    </div>

    <div id="editor" class="hidden">
        <header class="bg-white border-b sticky top-0 z-40 p-4 shadow-sm flex justify-between items-center">
            <h2 class="font-bold text-slate-800 text-xl italic">Configurações Pro</h2>
            <button onclick="salvarNoGithub()" id="btn-salvar" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> Publicar Alterações
            </button>
        </header>

        <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
            
            <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                <h3 class="font-bold text-slate-700 border-b pb-2 italic"><i class="fa-solid fa-clock mr-2 text-blue-500"></i>Funcionamento e Taxas</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-slate-50 p-4 rounded-xl border border-blue-100">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Horário de Atendimento</label>
                        <div class="flex items-center gap-3 mt-2">
                            <div class="flex-1">
                                <span class="text-[10px] text-slate-400 block">Abre às:</span>
                                <input type="time" id="cfg-abre" class="w-full p-2 rounded-lg border outline-none font-bold">
                            </div>
                            <div class="flex-1">
                                <span class="text-[10px] text-slate-400 block">Fecha às:</span>
                                <input type="time" id="cfg-fecha" class="w-full p-2 rounded-lg border outline-none font-bold">
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-200 flex items-center justify-between">
                            <span class="text-xs font-bold text-red-500 uppercase">Fechar Loja Agora (Emergência):</span>
                            <input type="checkbox" id="cfg-fechado-manual" class="w-6 h-6 accent-red-600">
                        </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Taxa de Entrega (R$)</label>
                        <input type="number" id="cfg-taxa" step="0.01" class="w-full bg-white p-3 rounded-xl border mt-2 font-bold text-emerald-600 outline-none text-xl">
                    </div>

                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Nome da Loja</label>
                        <input type="text" id="cfg-nome" class="w-full bg-slate-50 p-3 rounded-xl border mt-1 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">WhatsApp</label>
                        <input type="text" id="cfg-zap" class="w-full bg-slate-50 p-3 rounded-xl border mt-1 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Cor do Site</label>
                        <input type="color" id="cfg-cor" class="w-full h-12 rounded-xl border-none cursor-pointer mt-1">
                    </div>
                </div>
            </section>

            <section id="sessao-produtos">
                </section>
        </main>
    </div>

    <script>
        let dadosAtuais = {};
        let shaArquivo = "";

        async function carregarDadosAtuais() {
            const token = document.getElementById('gh-token').value;
            const repo = document.getElementById('gh-repo').value;
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/produtos.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await res.json();
                shaArquivo = data.sha;
                dadosAtuais = JSON.parse(atob(data.content));

                // PREENCHIMENTO SEGURO (SE NÃO EXISTIR, USA PADRÃO)
                document.getElementById('cfg-nome').value = dadosAtuais.config.nomeLoja || "Minha Loja";
                document.getElementById('cfg-zap').value = dadosAtuais.config.whatsapp || "";
                document.getElementById('cfg-taxa').value = dadosAtuais.config.taxaEntrega || 0;
                document.getElementById('cfg-abre').value = dadosAtuais.config.horaAbre || "18:00";
                document.getElementById('cfg-fecha').value = dadosAtuais.config.horaFecha || "23:59";
                document.getElementById('cfg-fechado-manual').checked = dadosAtuais.config.fechadoManual || false;
                document.getElementById('cfg-cor').value = dadosAtuais.config.corPrincipal || "#ef4444";
                
                document.getElementById('setup').classList.add('hidden');
                document.getElementById('editor').classList.remove('hidden');
                
                // Chame as funções de renderizar o restante aqui...
            } catch (e) { alert("Erro ao carregar! Verifique os dados."); }
        }

        async function salvarNoGithub() {
            // ... mesma lógica de salvar do código anterior, 
            // garantindo que os novos IDs (cfg-abre, cfg-fecha) sejam lidos.
        }
    </script>
</body>
</html>
