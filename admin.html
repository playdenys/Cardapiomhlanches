<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-4">Adicionar ao Cardápio</h1>
        <div class="space-y-3">
            <input type="text" id="nome" placeholder="Nome" class="w-full border p-2">
            <input type="number" id="preco" placeholder="Preço" class="w-full border p-2">
            <input type="text" id="img" placeholder="Link da Imagem" class="w-full border p-2">
            <button onclick="gerarJSON()" class="bg-green-600 text-white px-4 py-2 rounded">Adicionar e Gerar Código</button>
        </div>

        <h2 class="mt-8 font-bold text-red-600">Copie o conteúdo abaixo e cole no seu arquivo produtos.json no GitHub:</h2>
        <textarea id="resultado" class="w-full h-64 mt-2 p-2 bg-gray-900 text-green-400 font-mono text-xs rounded"></textarea>
    </div>

    <script>
        let lista = [];

        function gerarJSON() {
            const novo = {
                id: Date.now(),
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem: document.getElementById('img').value,
                categoria: "lanches"
            };
            lista.push(novo);
            document.getElementById('resultado').value = JSON.stringify(lista, null, 2);
        }
    </script>
</body>
</html>
